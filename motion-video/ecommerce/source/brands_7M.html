<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important;font-weight:400!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=9.5;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GDK='#8b95a8';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*26}px)">${w}</span>`;
}
const fmt=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const s=`stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
const ICONS=[
  `<path d="M-22 -10 L22 -10 L18 22 Q16 28 10 28 L-10 28 Q-16 28 -18 22 Z" ${s}/><path d="M22 -2 Q34 -2 32 8 Q30 18 18 16" ${s}/><path d="M-8 -18 q4 -6 0 -12 M4 -18 q4 -6 0 -12" ${s}/>`,   // coffee
  `<path d="M-22 -8 L22 -8 L18 28 L-18 28 Z" ${s}/><path d="M-10 -8 Q-10 -26 0 -26 Q10 -26 10 -8" ${s}/>`,                                                          // bag
  `<path d="M-12 -26 L-26 -16 L-20 -4 L-14 -8 L-14 26 L14 26 L14 -8 L20 -4 L26 -16 L12 -26 Q0 -16 -12 -26 Z" ${s}/>`,                                               // shirt
  `<path d="M-28 14 L-28 0 Q-14 2 -4 -10 L8 -6 Q14 6 30 8 L30 18 L-28 18 Z" ${s}/><path d="M-28 22 L30 22" ${s}/>`,                                                   // sneaker
  `<rect x="-12" y="-28" width="24" height="12" rx="3" ${s}/><rect x="-18" y="-16" width="36" height="44" rx="8" ${s}/><path d="M-10 4 L10 4" ${s}/>`,                 // bottle
  `<rect x="-16" y="-28" width="32" height="56" rx="7" ${s}/><path d="M-4 20 L4 20" ${s}/>`,                                                                         // phone
  `<circle r="16" ${s}/><path d="M0 -8 L0 0 L6 4" ${s}/><path d="M-10 -16 L-8 -28 L8 -28 L10 -16 M-10 16 L-8 28 L8 28 L10 16" ${s}/>`,                              // watch
  `<path d="M-24 4 Q-24 -24 0 -24 Q24 -24 24 4" ${s}/><rect x="-28" y="2" width="12" height="22" rx="5" ${s}/><rect x="16" y="2" width="12" height="22" rx="5" ${s}/>`, // headphones
  `<path d="M-24 -10 L0 -24 L24 -10 L24 18 L0 30 L-24 18 Z" ${s}/><path d="M-24 -10 L0 4 L24 -10 M0 4 L0 30" ${s}/>`,                                               // box
  `<path d="M0 24 C-30 4 -26 -22 -8 -22 C0 -22 0 -14 0 -12 C0 -14 0 -22 8 -22 C26 -22 30 4 0 24 Z" ${s}/>`,                                                          // heart / care
];
const CX=540, CY=1170, RX=400, RY=420, NT=ICONS.length;
const tilePos=i=>{const a=(-90+i*360/NT)*Math.PI/180;return [CX+RX*Math.cos(a),CY+RY*Math.sin(a)]};
const tileT=i=>.9+i*.16;
function render(t){
  let g='';
  const v=7e6*eio(seg(t,3.0,7.6)), hit=t>=7.6, hk=seg(t,7.6,8.0);
  // ring guide
  g+=`<ellipse cx="${CX}" cy="${CY}" rx="${RX}" ry="${RY}" fill="none" stroke="${SKY}" stroke-width="3" stroke-dasharray="8 14" stroke-dashoffset="${-t*40}" opacity="${seg(t,.8,1.3)*.6}"/>`;
  // links + sales packets from every brand to the centre
  for(let i=0;i<NT;i++){
    const [x,y]=tilePos(i), lk=eo(seg(t,tileT(i)+.3,tileT(i)+.7));
    const ex=L(x,CX,.62*lk), ey=L(y,CY,.62*lk);
    g+=`<line x1="${x}" y1="${y}" x2="${ex}" y2="${ey}" stroke="${NAVY}" stroke-width="3" stroke-dasharray="6 9" opacity=".3"/>`;
    if(t>3.0&&t<8.2)for(let k=0;k<2;k++){const q=((t-3.0)*1.1+k/2+i*.13)%1;
      const px=L(x,L(x,CX,.62),q), py=L(y,L(y,CY,.62),q);
      g+=`<g transform="translate(${px},${py})" opacity="${Math.sin(q*Math.PI)*(1-seg(t,7.8,8.2))}"><circle r="14" fill="${BLUE}"/><text y="6" text-anchor="middle" font-size="16" fill="#fff">ج</text></g>`}
  }
  // brand tiles
  for(let i=0;i<NT;i++){
    const [x,y]=tilePos(i), k=back(C(seg(t,tileT(i),tileT(i)+.45)));
    const pulse=t>3?Math.pow(Math.max(0,Math.sin((t-3)*3.2-i*.6)),8):0;
    g+=`<g transform="translate(${x},${y}) scale(${k*(1+.07*pulse)})" opacity="${C(k*3)}">
      <rect x="-66" y="-66" width="132" height="132" rx="32" fill="${i%2?NAVY:BLUE}" style="filter:drop-shadow(0 12px 22px rgba(11,31,77,.22))"/>
      ${ICONS[i]}
      ${t>3?`<rect x="-66" y="-66" width="132" height="132" rx="32" fill="none" stroke="${SKY}" stroke-width="5" opacity="${pulse}"/>`:''}</g>`;
  }
  // centre counter
  const ck=back(C(seg(t,2.6,3.1))), punch=hit?1+.08*Math.sin(hk*Math.PI):1, R0=215, R1=245;
  g+=`<g transform="translate(${CX},${CY}) scale(${ck*punch})" opacity="${C(ck*3)}">
    <circle r="${R1}" fill="none" stroke="#eef2fb" stroke-width="20"/>
    ${v>0?`<circle r="${R1}" fill="none" stroke="${BLUE}" stroke-width="20" stroke-linecap="round" pathLength="1" stroke-dasharray="${v/7e6} 1" transform="rotate(-90)" style="filter:drop-shadow(0 0 8px rgba(31,95,255,.5))"/>`:''}
    <circle r="${R0}" fill="${hit?BLUE:'#fff'}" stroke="${NAVY}" stroke-width="5" style="filter:drop-shadow(0 18px 36px rgba(11,31,77,.18))"/>
    <text y="-62" text-anchor="middle" font-size="36" fill="${hit?'#fff':GDK}">المبيعات</text>
    <text y="34" text-anchor="middle" font-size="78" fill="${hit?'#fff':NAVY}" style="direction:ltr">${fmt(Math.round(v/10000)*10000)}</text>
    <text y="96" text-anchor="middle" font-size="38" fill="${hit?'#dbe6ff':GDK}">ج.م</text></g>`;
  if(hit){
    for(let k=0;k<3;k++){const q=C((t-7.6-k*.18)/1.1);if(q>0&&q<1)g+=`<circle cx="${CX}" cy="${CY}" r="${R1+20+q*260}" fill="none" stroke="${BLUE}" stroke-width="4" opacity="${(1-q)*.5}"/>`}
    for(let i=0;i<28;i++){const a=i*2.3,q=seg(t,7.6,9.2),r=q*(330+(i%5)*50);
      const x=CX+Math.cos(a)*r,y=CY+Math.sin(a)*r+q*q*240;
      g+=`<rect x="${x}" y="${y}" width="14" height="${8+(i%3)*4}" rx="3" fill="${i%3?BLUE:i%2?SKY:NAVY}" transform="rotate(${i*40+q*400} ${x} ${y})" opacity="${1-q}"/>`}
  }
  const html=`<div class="abs ar" style="left:30px;right:30px;top:320px;font-size:66px;line-height:1.35">
    ${wd('اشتغلنا',t,.3)} ${wd('مع',t,.48)} ${wd('براندات',t,.66,'#1f5fff')} ${wd('كتير',t,.84,'#1f5fff')}<br>
    ${wd('وحققنا',t,2.0)} ${wd('مبيعات',t,2.18)} ${wd('وصلت',t,2.36)} ${wd('لسبعة',t,2.6,'#1f5fff')} ${wd('مليون.',t,2.78,'#1f5fff')}</div>`;
  const drift=1+seg(t,0,DUR)*.02;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // TRACK RECORD</div>
    <div class="lbl abs" style="right:70px;top:110px">00:0${Math.floor(t)} / 00:09</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${g}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
