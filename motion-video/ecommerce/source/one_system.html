<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important;font-weight:400!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=8.5;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GRAY='#c3cad8',GDK='#8b95a8';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*26}px)">${w}</span>`;
}
const TASKS=['إعلانات','محتوى','تصميمات','Landing Page','طلبات','شحن','متابعة','داتا','ميزانية','تقارير'];
const CX=540, CY=1010;
// chaotic home positions around the core
const HOME=TASKS.map((_,i)=>{const a=(i/TASKS.length)*Math.PI*2+rnd(i)*.5, r=250+rnd(i+5)*130;return [CX+Math.cos(a)*r*1.15, CY+Math.sin(a)*r*.95]});
const absorbT=i=>2.6+i*.15;
function avatar(x,y,s,calm,t){
  const brow=L(1,0,calm), sweat=(1-calm)*Math.max(0,Math.sin(t*3));
  return `<g transform="translate(${x},${y}) scale(${s})">
    <circle r="150" fill="${calm>.5?BLUE:GRAY}" opacity=".08"/>
    <path d="M-100 150 Q-100 40 0 40 Q100 40 100 150 Z" fill="${NAVY}"/>
    <circle cy="-30" r="66" fill="#fff" stroke="${NAVY}" stroke-width="7"/>
    <path d="M-38 ${-58-brow*4} L-12 ${-52+brow*6-(1-brow)*12}" stroke="${NAVY}" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 ${-58-brow*4} L12 ${-52+brow*6-(1-brow)*12}" stroke="${NAVY}" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-22" cy="-34" r="8" fill="${NAVY}"/><circle cx="22" cy="-34" r="8" fill="${NAVY}"/>
    <path d="M-20 ${4+brow*6} Q0 ${L(-4,20,calm)} 20 ${4+brow*6}" stroke="${NAVY}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M58 -70 q8 12 0 18 q-8 -6 0 -18" fill="${SKY}" opacity="${sweat}"/>
  </g>`;
}
function render(t){
  let g='';
  // tangled lines between tasks (chaos)
  const tangle=seg(t,.9,1.4)*(1-seg(t,2.5,3.0));
  if(tangle>0)for(let i=0;i<TASKS.length;i++)for(let j of [(i+3)%TASKS.length,(i+5)%TASKS.length]){
    const [x1,y1]=HOME[i],[x2,y2]=HOME[j];
    g+=`<path d="M${x1} ${y1} Q${(x1+x2)/2+(rnd(i*j)-.5)*260} ${(y1+y2)/2+(rnd(i+j)-.5)*260} ${x2} ${y2}" fill="none" stroke="${GRAY}" stroke-width="3" opacity="${tangle*.8}"/>`}
  // core system
  const ck=back(C(seg(t,2.3,2.8))), absorbed=TASKS.filter((_,i)=>t>absorbT(i)+.5).length;
  const grow=1+absorbed*.025, calm=eio(seg(t,4.6,5.8));
  if(ck>0){
    for(let k=0;k<3;k++){const q=((t*.6)+k/3)%1;g+=`<circle cx="${CX}" cy="${CY}" r="${150+q*190}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${(1-q)*.35*seg(t,2.8,3.2)}"/>`}
    g+=`<g transform="translate(${CX},${CY}) scale(${ck*grow})">
      <circle r="190" fill="none" stroke="${SKY}" stroke-width="3" stroke-dasharray="10 14" transform="rotate(${t*40})"/>
      <rect x="-130" y="-130" width="260" height="260" rx="60" fill="${NAVY}" style="filter:drop-shadow(0 22px 44px rgba(31,95,255,.4))"/>
      <rect x="-100" y="-100" width="200" height="200" rx="44" fill="none" stroke="${SKY}" stroke-width="3" stroke-dasharray="14 10" stroke-dashoffset="${t*50}"/>
      <text y="-6" text-anchor="middle" font-size="58" fill="#fff" class="mono" style="font-weight:600!important">System</text>
      <text y="48" text-anchor="middle" font-size="30" fill="${SKY}">${absorbed}/${TASKS.length}</text>
    </g>`;
    // orbiting dots once everything is inside
    if(t>4.3)for(let k=0;k<6;k++){const a=t*1.4+k*Math.PI/3;g+=`<circle cx="${CX+Math.cos(a)*190*grow}" cy="${CY+Math.sin(a)*190*grow}" r="9" fill="${BLUE}" opacity="${seg(t,4.3,4.7)}"/>`}
    const lk=back(C(seg(t,4.2,4.6)));
    g+=`<g transform="translate(${CX},${CY+290}) scale(${lk})" opacity="${C(lk*3)}"><rect x="-170" y="-40" width="340" height="80" rx="40" fill="${BLUE}" style="filter:drop-shadow(0 12px 24px rgba(31,95,255,.35))"/>
      <text y="14" text-anchor="middle" font-size="40" fill="#fff">سيستم واحد</text></g>`;
  }
  // task chips: float chaotically, then get pulled into the core
  TASKS.forEach((txt,i)=>{
    const ap=back(C(seg(t,.4+i*.1,.8+i*.1))); if(ap<=0)return;
    const ab=eio(seg(t,absorbT(i),absorbT(i)+.5)); if(ab>=1)return;
    const [hx,hy]=HOME[i], wob=(1-ab);
    const x=L(hx+Math.sin(t*2.3+i)*16*wob,CX,ab), y=L(hy+Math.cos(t*1.9+i*2)*14*wob,CY,ab);
    const rot=(rnd(i+20)-.5)*24*(1-ab)+Math.sin(t*3+i)*4*wob;
    const en=/[A-Za-z]/.test(txt), w=en?250:40+txt.length*30;
    g+=`<g transform="translate(${x},${y}) rotate(${rot}) scale(${ap*(1-ab*.8)})" opacity="${C(ap*3)*(1-ab*ab)}">
      <rect x="${-w/2}" y="-36" width="${w}" height="72" rx="36" fill="#fff" stroke="${NAVY}" stroke-width="3" style="filter:drop-shadow(0 10px 18px rgba(11,31,77,.15))"/>
      <text y="12" text-anchor="middle" font-size="${en?30:34}" fill="${NAVY}" ${en?'class="mono" style="font-weight:600!important"':''}>${txt}</text></g>`;
  });
  // owner + worry meter
  const ak=back(C(seg(t,.6,1.1))), shake=(1-calm)*seg(t,1.2,1.6)*Math.sin(t*40)*3;
  g+=`<g transform="translate(${shake},0)">${avatar(330,1530,.75*ak,calm,t)}</g>`;
  const fill=L(eo(seg(t,.9,2.0))*.95,0,eio(seg(t,4.7,5.9))), mk=seg(t,.9,1.2);
  const barCol=calm>.5?BLUE:mix([139,149,168],N,fill);
  g+=`<g opacity="${mk}" transform="translate(${shake},0)">
    <text x="900" y="1465" text-anchor="end" font-size="40" fill="${NAVY}">الهم</text>
    <text x="560" y="1465" font-size="34" fill="${calm>.5?BLUE:GDK}" class="mono">${Math.round(fill*100)}%</text>
    <rect x="560" y="1490" width="340" height="30" rx="15" fill="#eef2fb"/>
    <rect x="${900-340*fill}" y="1490" width="${340*fill}" height="30" rx="15" fill="${barCol}"/></g>`;
  const ok=back(C(seg(t,5.9,6.3)));
  g+=`<g transform="translate(730,1600) scale(${ok})" opacity="${C(ok*3)}"><rect x="-170" y="-38" width="340" height="76" rx="38" fill="${BLUE}"/>
    <circle cx="124" r="22" fill="#fff"/><path d="M115 0 L121 6 L134 -7" stroke="${BLUE}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-24" y="12" text-anchor="middle" font-size="34" fill="#fff">ولا هم</text></g>`;
  for(let i=0;i<6;i++){const q=seg(t,5.8+i*.12,6.9+i*.12);if(q>0&&q<1)g+=`<g transform="translate(${330+(i-2.5)*50},${1440-q*160})" opacity="${1-q}"><path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="${BLUE}"/></g>`}
  const html=`<div class="abs ar" style="left:30px;right:30px;top:300px;font-size:74px;line-height:1.32">
    ${wd('جمعنا',t,.3)} ${wd('كل',t,.5,'#1f5fff')} ${wd('ده',t,.68,'#1f5fff')}<br>
    ${wd('في',t,2.7)} ${wd('سيستم',t,2.9,'#1f5fff')} ${wd('واحد',t,3.1,'#1f5fff')}<br>
    ${wd('يشيل',t,4.5)} ${wd('من',t,4.68)} ${wd('عليك',t,4.86)} ${wd('أي',t,5.04)} ${wd('هم',t,5.22,'#1f5fff')}</div>`;
  const drift=1+seg(t,0,DUR)*.02;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // ONE SYSTEM</div>
    <div class="lbl abs" style="right:70px;top:110px">00:0${Math.floor(t)} / 00:08</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${g}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
