<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important;font-weight:400!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=16.8;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GRAY='#c3cad8',GDK='#8b95a8',RED='#E5484D';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*26}px)">${w}</span>`;
}
function line(items,t,t0,dt=.15){let j=0;return items.map(it=>typeof it==='string'?wd(it,t,t0+(j++)*dt):wd(it.w,t,t0+(j++)*dt,it.c)).join(' ')}
const BL=w=>({w,c:'#1f5fff'}), RD=w=>({w,c:RED});
const SC=[
  {t0:0,t1:4.3,fs:66,l:[[BL('90%'),'من','براندات',BL('الـE-commerce')],['بتقع','في',RD('غلطتين'),'كبار','جدًا:']]},
  {t0:4.3,t1:10.3,fs:62,l:[[RD('أول'),RD('غلطة:')],['مفيش','سيستم','يخلي','العميل'],['يشتري','منك',BL('أكتر'),BL('من'),BL('مرة')]]},
  {t0:10.3,t1:16.9,fs:54,l:[[RD('تاني'),RD('غلطة:')],['مفيش','سيستم','يزود'],[BL('متوسط'),BL('قيمة'),BL('الطلب')],['اللي','العميل','بيطلبه','منك','كل','شهر']]},
];
const xMark=(x,y,k,r=26)=>`<g transform="translate(${x},${y}) scale(${k})"><circle r="${r}" fill="${RED}"/><path d="M${-r*.35} ${-r*.35} L${r*.35} ${r*.35} M${r*.35} ${-r*.35} L${-r*.35} ${r*.35}" stroke="#fff" stroke-width="${r*.22}" stroke-linecap="round"/></g>`;
const vMark=(x,y,k,r=26)=>`<g transform="translate(${x},${y}) scale(${k})"><circle r="${r}" fill="${BLUE}"/><path d="M${-r*.4} 0 L${-r*.1} ${r*.3} L${r*.42} ${-r*.3}" stroke="#fff" stroke-width="${r*.22}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
function store(x,y,s,col,op=1){
  return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}">
    <rect x="-56" y="-14" width="112" height="70" rx="8" fill="#fff" stroke="${col}" stroke-width="5"/>
    <path d="M-64 -14 L-54 -44 L54 -44 L64 -14 Z" fill="${col}"/>
    ${[0,1,2,3].map(j=>`<path d="M${-64+j*32} -14 q16 16 32 0" fill="${j%2?'#fff':col}" stroke="${col}" stroke-width="3"/>`).join('')}
    <rect x="-14" y="16" width="28" height="40" rx="3" fill="#eef2fb" stroke="${col}" stroke-width="3"/></g>`;
}
function avatar(x,y,s,op,gray){const c=gray?GDK:NAVY;return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}">
  <path d="M-80 120 Q-80 30 0 30 Q80 30 80 120 Z" fill="${c}"/><circle cy="-26" r="54" fill="#fff" stroke="${c}" stroke-width="7"/>
  <circle cx="-18" cy="-30" r="7" fill="${c}"/><circle cx="18" cy="-30" r="7" fill="${c}"/><path d="M-16 -2 Q0 8 16 -2" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/></g>`}

function scene1(t){
  let g='';const out=seg(t,4.0,4.3);
  for(let i=0;i<10;i++){
    const x=150+(i%5)*195, y=820+Math.floor(i/5)*230, k=back(C(seg(t,.4+i*.07,.8+i*.07)));
    const bad=i<9, mk=bad?seg(t,1.2+i*.12,1.45+i*.12):seg(t,2.4,2.7);
    g+=`<g opacity="${C(k*3)*(1-out)}"><rect x="${x-82}" y="${y-82}" width="164" height="164" rx="34" fill="${bad&&mk>0?'#fff4f4':'#fff'}" stroke="${bad&&mk>0?RED:'#dfe6f4'}" stroke-width="4" transform="translate(${x},${y}) scale(${k}) translate(${-x},${-y})"/>
      ${store(x,y-6,.95*k,bad&&mk>0?RED:(bad?NAVY:BLUE))}
      ${mk>0?(bad?xMark(x+60,y-62,back(mk)):vMark(x+60,y-62,back(mk))):''}</g>`;
  }
  const pk=seg(t,1.2,2.5), pv=Math.round(90*eio(pk));
  g+=`<g opacity="${seg(t,1.1,1.3)*(1-out)}"><text x="540" y="1370" text-anchor="middle" font-size="150" fill="${RED}" class="mono" style="font-weight:600!important;direction:ltr">${pv}%</text></g>`;
  [0,1].forEach(i=>{const k=back(C(seg(t,2.9+i*.25,3.3+i*.25)));
    const x=i?330:750;
    g+=`<g transform="translate(${x},1530) scale(${k})" opacity="${C(k*3)*(1-out)}"><rect x="-190" y="-60" width="380" height="120" rx="34" fill="#fff" stroke="${RED}" stroke-width="5" style="filter:drop-shadow(0 12px 24px rgba(229,72,77,.18))"/>
      <circle cx="120" r="38" fill="${RED}"/><text x="120" y="16" text-anchor="middle" font-size="46" fill="#fff" class="mono" style="font-weight:600!important">${i+1}</text>
      <text x="-30" y="14" text-anchor="middle" font-size="42" fill="${NAVY}">غلطة</text></g>`});
  return g;
}
function scene2(t){
  const lt=t-4.3; if(lt<0||t>10.4)return '';
  const inn=eo(seg(lt,.3,.8)), out=seg(t,10.0,10.3), away=eio(seg(t,8.2,9.2));
  let g=`<g opacity="${inn*(1-out)}">`;
  const ax=L(270,140,away), ay=1060;
  g+=avatar(ax,ay,1.1,L(1,.35,away),away>.3);
  g+=store(810,1050,1.45,BLUE);
  // first purchase: coin travels to the store
  const p=seg(t,5.6,6.4);
  if(p>0&&p<1)g+=`<g transform="translate(${L(330,760,eio(p))},${1040-Math.sin(p*Math.PI)*120})"><circle r="24" fill="${BLUE}"/><text y="8" text-anchor="middle" font-size="22" fill="#fff">ج</text></g>`;
  const b1=back(C(seg(t,6.3,6.7)));
  g+=`<g transform="translate(540,880) scale(${b1})" opacity="${C(b1*3)}"><rect x="-130" y="-38" width="260" height="76" rx="38" fill="${BLUE}"/><text y="12" text-anchor="middle" font-size="34" fill="#fff">أول شراء ✓</text></g>`;
  // repeat-purchase loop tries to form, then breaks
  const lk=eio(seg(t,6.9,7.7)), brk=seg(t,7.7,8.0);
  const arc=`M810 1210 Q540 1420 ${L(810,300,lk)} ${L(1210,1210,lk)}`;
  if(lk>0){
    g+=`<path d="M810 1210 Q540 1420 300 1210" fill="none" stroke="${brk>0?RED:SKY}" stroke-width="7" pathLength="1" stroke-linecap="round" stroke-dasharray="${brk>0?'0.02 0.035':lk+' 1'}" opacity="${brk>0?.85:1}"/>`;
    g+=`<text x="540" y="1390" text-anchor="middle" font-size="36" fill="${brk>0?RED:NAVY}" opacity="${seg(t,7.1,7.4)}">مرة تانية؟</text>`;
  }
  if(brk>0)g+=xMark(555,1312,back(brk),40);
  // purchases counter
  const ck=seg(t,8.6,8.9);
  g+=`<g opacity="${ck}"><rect x="190" y="1470" width="700" height="140" rx="34" fill="#fff" stroke="${NAVY}" stroke-width="4"/>
    <text x="850" y="1555" text-anchor="end" font-size="40" fill="${NAVY}">عدد مرات الشراء</text>
    <text x="330" y="1567" text-anchor="middle" font-size="84" fill="${BLUE}" class="mono" style="font-weight:600!important">1</text>
    <text x="250" y="1567" text-anchor="middle" font-size="60" fill="${GRAY}" class="mono">2</text>
    <line x1="225" y1="1530" x2="275" y2="1560" stroke="${RED}" stroke-width="6" stroke-linecap="round"/></g>`;
  return g+'</g>';
}
function scene3(t){
  const lt=t-10.3; if(lt<0)return '';
  const inn=eo(seg(lt,.3,.8));
  let g=`<g opacity="${inn}">`;
  // cart: one item, empty upsell slots
  const ck=back(C(seg(t,10.7,11.2)));
  g+=`<g transform="translate(540,900) scale(${ck})">
    <path d="M-250 -110 L-200 -110 L-150 100 L190 100 L230 -40 L-170 -40" fill="none" stroke="${NAVY}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="-110" cy="150" r="26" fill="${NAVY}"/><circle cx="150" cy="150" r="26" fill="${NAVY}"/>
    <rect x="-130" y="-24" width="90" height="100" rx="14" fill="${BLUE}"/>
    ${[0,1].map(i=>{const pulse=.5+.5*Math.sin(t*4+i);return `<rect x="${-20+i*110}" y="-24" width="90" height="100" rx="14" fill="none" stroke="${GRAY}" stroke-width="4" stroke-dasharray="10 8" opacity="${.6+.4*pulse}"/><text x="${25+i*110}" y="40" text-anchor="middle" font-size="48" fill="${GRAY}">+</text>`}).join('')}
  </g>`;
  const ek=seg(t,11.6,11.9);
  g+=`<text x="540" y="1110" text-anchor="middle" font-size="34" fill="${GDK}" opacity="${ek}">ولا منتج زيادة…</text>`;
  // flat average order value, month after month (RTL: month 1 on the right)
  const base=1500, hh=190, X=[840,640,440,240];
  g+=`<line x1="150" y1="${base}" x2="930" y2="${base}" stroke="${NAVY}" stroke-width="4" opacity="${seg(t,11.8,12.1)}"/>`;
  X.forEach((x,i)=>{const k=eo(seg(t,12.0+i*.25,12.5+i*.25));
    g+=`<rect x="${x-60}" y="${base-hh*k}" width="120" height="${hh*k}" rx="14" fill="${SKY}" opacity=".6"/>
      <text x="${x}" y="${base+50}" text-anchor="middle" font-size="30" fill="${GDK}" direction="rtl" unicode-bidi="embed" opacity="${seg(t,12.0+i*.25,12.3+i*.25)}">شهر ${i+1}</text>`});
  const fl=eo(seg(t,13.2,13.8));
  g+=`<line x1="${930-780*fl}" y1="${base-hh}" x2="930" y2="${base-hh}" stroke="${NAVY}" stroke-width="5" stroke-dasharray="12 10" opacity="${fl>0?1:0}"/>
    <text x="930" y="${base-hh-26}" text-anchor="end" font-size="32" fill="${NAVY}" opacity="${seg(t,13.4,13.7)}">متوسط قيمة الطلب</text>`;
  // an increase that never happens
  const up=eio(seg(t,14.0,14.6)), bx=seg(t,14.6,14.9);
  if(up>0)g+=`<path d="M240 ${base-hh-10} L240 ${base-hh-10-170*up}" stroke="${bx>0?RED:BLUE}" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
    <path d="M218 ${base-hh-150*up} L240 ${base-hh-178*up} L262 ${base-hh-150*up}" stroke="${bx>0?RED:BLUE}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${seg(up,.8,1)}"/>`;
  if(bx>0)g+=xMark(240,base-hh-100,back(bx),38);
  return g+'</g>';
}
function render(t){
  let svg='',html='';
  SC.forEach((sc,i)=>{if(t<sc.t0||t>sc.t1)return;const out=i<2?seg(t,sc.t1-.3,sc.t1):0;let j=0;
    html+=`<div class="abs ar" style="left:30px;right:30px;top:280px;font-size:${sc.fs}px;line-height:1.34;opacity:${1-out};filter:blur(${out*10}px);transform:translateY(${-out*40}px)">${sc.l.map(l=>{const s=line(l,t,sc.t0+.2+j*.15);j+=l.length;return s}).join('<br>')}</div>`});
  if(t<4.4)svg+=scene1(t);
  svg+=scene2(t)+scene3(t);
  const drift=1+seg(t,0,DUR)*.02;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // 2 MISTAKES</div>
    <div class="lbl abs" style="right:70px;top:110px">00:${String(Math.floor(t)).padStart(2,'0')} / 00:16</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${svg}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
