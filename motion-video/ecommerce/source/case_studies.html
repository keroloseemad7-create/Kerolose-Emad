<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important;font-weight:400!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=14.5;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GDK='#8b95a8';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*26}px)">${w}</span>`;
}
function line(items,t,t0,dt=.16){let j=0;return items.map(it=>typeof it==='string'?wd(it,t,t0+(j++)*dt):wd(it.w,t,t0+(j++)*dt,'#1f5fff')).join(' ')}
const fmt=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const BL=w=>({w});
const CASES=[
  {t0:0, t1:6.8, tag:'CASE 01', title:'براند قهوة', icon:'cup',
   head:[['والطريقة','دي','خلتنا','نوصل','مع'],[BL('براند'),BL('قهوة'),'من','زيرو'],[BL('لمية'),BL('ألف'),BL('جنيه'),'في','خمس','شهور','بس.']],
   months:5, from:0, to:100000, curve:[0,.08,.24,.5,1], kind:'line', grow:[2.4,5.4], pill:'في 5 شهور بس'},
  {t0:6.8, t1:14.6, tag:'CASE 02', title:'براند تاني', icon:'bag',
   head:[['الطريقة','دي','خلتنا',BL('نضاعف'),'مبيعات'],['براند','تاني','من','مية','ألف','جنيه'],[BL('لنص'),BL('مليون'),BL('جنيه'),'في','ست','شهور','بس.']],
   months:6, from:100000, to:500000, curve:[.2,.3,.42,.58,.76,1], kind:'bars', grow:[9.2,12.2], pill:'في 6 شهور بس', mult:'×5'},
];
function icon(kind,t){
  const s=`stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  if(kind==='cup'){
    const steam=[0,1,2].map(i=>{const p=((t*.8)+i/3)%1;return `<path d="M${-16+i*16} ${-20-p*30} q6 -8 0 -16 q-6 -8 0 -16" ${s} stroke-width="4" opacity="${Math.sin(p*Math.PI)}"/>`}).join('');
    return `${steam}<path d="M-30 -14 L30 -14 L24 28 Q22 36 14 36 L-14 36 Q-22 36 -24 28 Z" ${s}/><path d="M30 -4 Q46 -4 44 10 Q42 22 26 22" ${s}/>`;
  }
  return `<path d="M-28 -12 L28 -12 L24 34 L-24 34 Z" ${s}/><path d="M-12 -12 Q-12 -32 0 -32 Q12 -32 12 -12" ${s}/>`;
}
function card(c,t){
  const lt=t-c.t0, inn=eo(seg(lt,.5,1.0)), out=c.t1<14?eio(seg(t,c.t1-.4,c.t1)):0;
  const x0=70,y0=700,w=940,h=820;
  let g=`<g transform="translate(${-out*1100+(1-inn)*0},${(1-inn)*120})" opacity="${inn*(1-out*.6)}">
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="44" fill="#fff" stroke="${NAVY}" stroke-width="4" style="filter:drop-shadow(0 20px 40px rgba(11,31,77,.14))"/>
    <g transform="translate(${x0+w-90},${y0+90}) scale(${back(C(seg(lt,.9,1.3)))})"><circle r="52" fill="${BLUE}"/>${icon(c.icon,t)}</g>
    <text x="${x0+w-165}" y="${y0+104}" text-anchor="end" font-size="44" fill="${NAVY}">${c.title}</text>
    <text x="${x0+50}" y="${y0+100}" font-size="24" fill="${SKY}" class="mono">${c.tag}</text>`;
  // counter
  const gk=eio(seg(t,c.grow[0],c.grow[1])), v=L(c.from,c.to,gk), done=t>=c.grow[1];
  const punch=done?1+.08*Math.sin(seg(t,c.grow[1],c.grow[1]+.4)*Math.PI):1;
  g+=`<g transform="translate(${x0+w/2},${y0+250}) scale(${punch})" opacity="${seg(lt,1.2,1.5)}">
    <text x="-40" y="0" text-anchor="middle" font-size="112" fill="${done?BLUE:NAVY}" style="direction:ltr">${fmt(Math.round(v/1000)*1000)}</text>
    <text x="300" y="-4" text-anchor="middle" font-size="40" fill="${GDK}">ج.م</text></g>`;
  // chart (RTL: month 1 on the right)
  const cx0=x0+90, cx1=x0+w-90, base=y0+h-150, top=y0+360, n=c.months;
  const X=i=>L(cx1,cx0,i/(n-1)), Y=k=>L(base,top,k);
  g+=`<line x1="${cx0-30}" y1="${base}" x2="${cx1+30}" y2="${base}" stroke="${NAVY}" stroke-width="4" opacity="${seg(lt,1.3,1.6)}"/>`;
  for(let i=0;i<n;i++)g+=`<text x="${X(i)}" y="${base+52}" text-anchor="middle" font-size="28" fill="${GDK}" direction="rtl" unicode-bidi="embed" opacity="${seg(lt,1.4+i*.06,1.7+i*.06)}">شهر ${i+1}</text>`;
  if(c.kind==='line'){
    const pts=c.curve.map((k,i)=>[X(i),Y(k)]), m=gk*(n-1), j=Math.min(n-2,Math.floor(m)), f=m-j;
    const head=[L(pts[j][0],pts[j+1][0],f),L(pts[j][1],pts[j+1][1],f)];
    const vis=pts.slice(0,j+1).concat([head]);
    if(gk>0){
      g+=`<path d="M${vis.map(p=>p.join(' ')).join(' L')} L${head[0]} ${base} L${pts[0][0]} ${base} Z" fill="url(#area)"/>`;
      g+=`<path d="M${vis.map(p=>p.join(' ')).join(' L')}" fill="none" stroke="${BLUE}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 10px rgba(31,95,255,.4))"/>`;
      vis.slice(0,-1).forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="#fff" stroke="${BLUE}" stroke-width="5"/>`);
      g+=`<circle cx="${head[0]}" cy="${head[1]}" r="${16+(done?0:Math.sin(t*10)*3)}" fill="${BLUE}" stroke="#fff" stroke-width="5"/>`;
    }
    g+=`<text x="${pts[0][0]}" y="${base-26}" text-anchor="middle" font-size="30" fill="${GDK}" class="mono" opacity="${seg(lt,1.6,1.9)}">0</text>`;
  } else {
    c.curve.forEach((k,i)=>{const bk=eo(seg(gk*(n),i,i+1.2)), hh=(base-top)*k*bk;
      g+=`<rect x="${X(i)-46}" y="${base-hh}" width="92" height="${hh}" rx="14" fill="${i===n-1?BLUE:SKY}" opacity="${i===n-1?1:.55}"/>`;});
    g+=`<text x="${X(0)}" y="${base-(base-top)*c.curve[0]*eo(seg(gk*n,0,1.2))-16}" text-anchor="middle" font-size="28" fill="${NAVY}" class="mono" opacity="${seg(lt,2.5,2.8)}">100K</text>`;
    g+=`<text x="${X(n-1)}" y="${base-(base-top)*eo(seg(gk*n,n-1,n+.2))-16}" text-anchor="middle" font-size="30" fill="${BLUE}" class="mono" style="font-weight:600!important" opacity="${seg(gk*n,n-.6,n)}">500K</text>`;
  }
  // result pills
  const pk=back(C(seg(t,c.grow[1]+.2,c.grow[1]+.6)));
  g+=`<g transform="translate(${x0+w/2},${y0+h+10}) scale(${pk})" opacity="${C(pk*3)}"><rect x="-200" y="-40" width="400" height="80" rx="40" fill="${BLUE}" style="filter:drop-shadow(0 12px 24px rgba(31,95,255,.35))"/>
    <text y="14" text-anchor="middle" font-size="38" fill="#fff">${c.pill}</text></g>`;
  if(c.mult){const mk=back(C(seg(t,c.grow[1]+.5,c.grow[1]+.9)));
    g+=`<g transform="translate(${x0+125},${y0+232}) rotate(-8) scale(${mk})" opacity="${C(mk*3)}"><circle r="64" fill="${NAVY}"/><text y="20" text-anchor="middle" font-size="56" fill="#fff" class="mono" style="font-weight:600!important">${c.mult}</text></g>`;}
  if(done)for(let k=0;k<2;k++){const q=C((t-c.grow[1]-k*.2)/1.0);if(q>0&&q<1)g+=`<rect x="${x0-q*60}" y="${y0-q*60}" width="${w+q*120}" height="${h+q*120}" rx="${44+q*30}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${(1-q)*.45}"/>`}
  return g+'</g>';
}
function render(t){
  let svg=`<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${BLUE}" stop-opacity=".28"/><stop offset="1" stop-color="${BLUE}" stop-opacity="0"/></linearGradient></defs>`,html='';
  CASES.forEach((c,ci)=>{
    if(t<c.t0||t>c.t1)return;
    const out=ci===0?seg(t,c.t1-.35,c.t1):0;let j=0;
    html+=`<div class="abs ar" style="left:30px;right:30px;top:290px;font-size:62px;line-height:1.32;opacity:${1-out};filter:blur(${out*10}px);transform:translateY(${-out*40}px)">${c.head.map(l=>{const s=line(l,t,c.t0+.2+j*.16);j+=l.length;return s}).join('<br>')}</div>`;
    svg+=card(c,t);
  });
  const drift=1+seg(t,0,DUR)*.02;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // RESULTS</div>
    <div class="lbl abs" style="right:70px;top:110px">00:${String(Math.floor(t)).padStart(2,'0')} / 00:14</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${svg}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
