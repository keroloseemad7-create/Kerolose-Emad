<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
.iso{direction:ltr;unicode-bidi:isolate;display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important;font-weight:400!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=12;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GRAY='#c3cad8',GDK='#8b95a8',RED='#E5484D';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*26}px)">${w}</span>`;
}
</script>
<script src="prod.js"></script>
<script>
const s=`stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
// ---------- scene 1: the same template stamped on everyone
const CARDS=[0,1,2,3,4,5].map(i=>[230+(i%3)*310, 860+Math.floor(i/3)*340]);
const stampT=i=>.9+i*.3;
function scene1(t){
  const out=eio(seg(t,3.6,4.1));
  let g=`<g opacity="${1-out}" transform="translate(0,${-out*60})">`;
  CARDS.forEach(([x,y],i)=>{
    const k=back(C(seg(t,.4+i*.06,.75+i*.06))), st=seg(t,stampT(i),stampT(i)+.15);
    g+=`<g transform="translate(${x},${y}) scale(${k})" opacity="${C(k*3)}">
      <rect x="-120" y="-140" width="240" height="280" rx="26" fill="#fff" stroke="${GRAY}" stroke-width="4"/>
      ${st>0?`<g opacity="${st}"><rect x="-96" y="-116" width="192" height="26" rx="8" fill="${GRAY}"/><rect x="-96" y="-76" width="192" height="96" rx="12" fill="#e5e9f1"/>
        <rect x="-96" y="34" width="150" height="14" rx="7" fill="${GRAY}"/><rect x="-96" y="58" width="110" height="14" rx="7" fill="${GRAY}"/><rect x="-96" y="90" width="90" height="32" rx="16" fill="${GDK}"/></g>`:''}
    </g>`;
    // copy flash
    if(st>0&&st<1)g+=`<rect x="${x-130}" y="${y-150}" width="260" height="300" rx="30" fill="none" stroke="${GDK}" stroke-width="4" opacity="${1-st}"/>`;
  });
  // the stamp moving card to card
  if(t>.7&&t<3.2){
    const i=Math.min(5,Math.max(0,Math.floor((t-.7)/.3))), f=((t-.7)/.3)%1;
    const [x,y]=CARDS[i], press=Math.sin(C(f/.7)*Math.PI);
    g+=`<g transform="translate(${x+40},${y-100-90*(1-press)})">
      <rect x="-60" y="40" width="120" height="30" rx="8" fill="${GDK}"/><rect x="-22" y="-40" width="44" height="80" rx="10" fill="${NAVY}"/><ellipse cy="-46" rx="40" ry="18" fill="${NAVY}"/></g>`;
  }
  // big cross over the cookie-cutter approach
  const xk=seg(t,3.0,3.3);
  if(xk>0)g+=`<g opacity="${xk}"><line x1="${110}" y1="${730}" x2="${L(110,970,eo(xk))}" y2="${L(730,1340,eo(xk))}" stroke="${RED}" stroke-width="14" stroke-linecap="round"/>
    <line x1="970" y1="730" x2="${L(970,110,eo(seg(t,3.1,3.4)))}" y2="${L(730,1340,eo(seg(t,3.1,3.4)))}" stroke="${RED}" stroke-width="14" stroke-linecap="round"/></g>
    <g transform="translate(540,1600) scale(${back(C(seg(t,3.1,3.45)))})"><rect x="-170" y="-44" width="340" height="88" rx="44" fill="#fff" stroke="${RED}" stroke-width="5"/>
      <text y="14" text-anchor="middle" font-size="40" fill="${RED}" class="mono" style="font-weight:600!important;text-decoration:line-through">TEMPLATE</text></g>`;
  return g+'</g>';
}
// ---------- scene 2: built on product, margin, AOV
const INP=[
  {lab:'المنتج', t:4.5, x:860, ic:t=>prod('box',0,4,.42,false,1,0).replace(/<g transform="translate\(0,4\)/,'<g transform="translate(0,4)')},
  {lab:'الهامش', t:5.5, x:540, ic:t=>{const a=L(0,.42,eo(seg(t,5.6,6.2)))*Math.PI*2;return `<circle r="30" fill="#fff" opacity=".25"/><path d="M0 0 L0 -30 A30 30 0 ${a>Math.PI?1:0} 1 ${30*Math.sin(a)} ${-30*Math.cos(a)} Z" fill="#fff"/><text x="0" y="56" text-anchor="middle" font-size="24" fill="#fff" class="mono">%</text>`}},
  {lab:'الـ AOV', t:6.6, x:220, ic:t=>`<path d="M-28 -18 L-20 -18 L-14 12 L18 12 L24 -8 L-17 -8" ${s}/><circle cx="-10" cy="22" r="4" fill="#fff"/><circle cx="14" cy="22" r="4" fill="#fff"/><g transform="translate(20,-26) rotate(20)"><path d="M-10 -8 L6 -8 L14 0 L6 8 L-10 8 Z" fill="#fff"/></g>`},
];
function scene2(t){
  if(t<4.1||t>9.2)return '';
  const out=eio(seg(t,8.7,9.2));
  let g=`<g opacity="${1-out}" transform="translate(540,1100) scale(${1-out*.3}) translate(-540,-1100)">`;
  // custom blueprint built from the three inputs
  const bk=eo(seg(t,7.0,7.5));
  if(bk>0){
    g+=`<rect x="110" y="1240" width="860" height="430" rx="36" fill="#f5f8ff" stroke="${NAVY}" stroke-width="4" opacity="${bk}"/>
      <g opacity="${bk*.5}">${Array.from({length:11},(_,i)=>`<line x1="${150+i*78}" y1="1270" x2="${150+i*78}" y2="1640" stroke="${SKY}" stroke-width="1"/>`).join('')}${Array.from({length:5},(_,i)=>`<line x1="140" y1="${1290+i*80}" x2="940" y2="${1290+i*80}" stroke="${SKY}" stroke-width="1"/>`).join('')}</g>
      <text x="930" y="1300" text-anchor="end" font-size="22" fill="${GDK}" class="mono" opacity="${bk}">BUILT FOR YOUR BRAND</text>`;
    const nodes=[[760,1400],[600,1480],[430,1390],[300,1520],[520,1590],[700,1570]];
    nodes.forEach(([x,y],i)=>{const k=back(C(seg(t,7.4+i*.12,7.75+i*.12)));
      if(i>0){const [px,py]=nodes[i-1],lk=eo(seg(t,7.4+i*.12,7.7+i*.12));g+=`<line x1="${px}" y1="${py}" x2="${L(px,x,lk)}" y2="${L(py,y,lk)}" stroke="${BLUE}" stroke-width="5"/>`}
      g+=`<g transform="translate(${x},${y}) scale(${k})"><rect x="-34" y="-34" width="68" height="68" rx="18" fill="${i%2?NAVY:BLUE}"/></g>`});
  }
  INP.forEach((p,i)=>{
    const k=back(C(seg(t,p.t,p.t+.45))); if(k<=0)return;
    const hl=1-seg(t,p.t+.7,p.t+1.3), y=900;
    g+=`<g transform="translate(${p.x},${y}) scale(${k})" opacity="${C(k*3)}">
      <rect x="-140" y="-150" width="280" height="300" rx="38" fill="#fff" stroke="${hl>.05?BLUE:NAVY}" stroke-width="${4+hl*3}" style="filter:drop-shadow(0 14px 28px rgba(${hl>.05?'31,95,255,.28':'11,31,77,.12'}))"/>
      <g transform="translate(0,-36) scale(1.5)"><circle r="44" fill="${BLUE}"/>${p.ic(t)}</g>
      <text y="104" text-anchor="middle" font-size="44" fill="${NAVY}" direction="rtl" unicode-bidi="embed">${p.lab}</text></g>`;
    // feed into the blueprint
    const fk=eo(seg(t,7.1+i*.1,7.6+i*.1));
    if(fk>0){g+=`<line x1="${p.x}" y1="1050" x2="${p.x}" y2="${L(1050,1240,fk)}" stroke="${BLUE}" stroke-width="5" stroke-dasharray="8 8"/>`;
      if(t>7.6){const q=((t-7.6)*1.4+i/3)%1;g+=`<circle cx="${p.x}" cy="${L(1050,1240,q)}" r="9" fill="${BLUE}" opacity="${Math.sin(q*Math.PI)}"/>`}}
  });
  return g+'</g>';
}
// ---------- scene 3: E-com Growth System
function scene3(t){
  if(t<8.9)return '';
  const k=eo(seg(t,9.0,9.6)), uk=eo(seg(t,9.5,10.3));
  let g='';
  for(let r=0;r<3;r++){const q=((t-9)*.5+r/3)%1;g+=`<circle cx="540" cy="1030" r="${200+q*360}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${(1-q)*.25*k}"/>`}
  g+=`<g transform="translate(540,1030) scale(${back(C(seg(t,8.95,9.45)))})"><rect x="-90" y="-90" width="180" height="180" rx="42" fill="${NAVY}" style="filter:drop-shadow(0 20px 40px rgba(31,95,255,.4))"/>
    <rect x="-68" y="-68" width="136" height="136" rx="30" fill="none" stroke="${SKY}" stroke-width="3" stroke-dasharray="12 9" stroke-dashoffset="${t*50}"/>
    <text y="14" text-anchor="middle" font-size="40" fill="#fff" class="mono" style="font-weight:600!important">PGS</text></g>`;
  g+=`<text x="540" y="${L(1300,1260,k)}" text-anchor="middle" font-size="96" fill="${BLUE}" opacity="${k}" style="filter:drop-shadow(0 0 22px rgba(31,95,255,.35))">E-com Growth System</text>
    <rect x="${150+780*(1-uk)}" y="1300" width="${780*uk}" height="7" rx="3" fill="${BLUE}" style="filter:drop-shadow(0 0 10px rgba(31,95,255,.6))"/>`;
  return g;
}
function render(t){
  let g=scene1(t)+scene2(t)+scene3(t), html='';
  const o1=seg(t,3.7,4.0);
  if(t<4.05)html+=`<div class="abs ar" style="left:30px;right:30px;top:300px;font-size:76px;line-height:1.3;opacity:${1-o1};filter:blur(${o1*10}px);transform:translateY(${-o1*40}px)">
    ${wd('ده',t,.3)} ${wd('مش',t,.45,'#E5484D')} <span class="iso">${wd('Template',t,.62,'#E5484D')}</span><br>${wd('بنركّبه',t,1.0)} ${wd('لكل',t,1.2)} ${wd('الناس.',t,1.4)}</div>`;
  const o2=seg(t,8.6,8.95);
  if(t>=3.95&&t<9)html+=`<div class="abs ar" style="left:30px;right:30px;top:300px;font-size:72px;line-height:1.3;opacity:${1-o2};filter:blur(${o2*10}px);transform:translateY(${-o2*40}px)">
    ${wd('بنبنيه',t,4.05)} ${wd('على',t,4.25)} ${wd('المنتج،',t,4.5,'#1f5fff')}<br>${wd('والهامش،',t,5.5,'#1f5fff')} ${wd('والـAOV',t,6.6,'#1f5fff')} ${wd('بتاعك',t,6.9)}</div>`;
  const drift=1+seg(t,0,DUR)*.02;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // CUSTOM BUILT</div>
    <div class="lbl abs" style="right:70px;top:110px">00:${String(Math.floor(t)).padStart(2,'0')} / 00:12</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${g}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
