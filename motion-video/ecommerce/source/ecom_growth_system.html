<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
.iso{direction:ltr;unicode-bidi:isolate;display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important;font-weight:400!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=11.5;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GRAY='#b3bbcb',GDK='#8b95a8';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*26}px)">${w}</span>`;
}
const fmt=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
</script>
<script src="prod.js"></script>
<script>
const CX=540, CY=1080, R=300;
const MODS=['إعلانات','Funnel','إعادة الشراء','زيادة قيمة الطلب','داتا'];
const modT=i=>1.5+i*.28;
function render(t){
  let g='',html='';
  const morph=eio(seg(t,4.5,5.3));              // system wraps around the product
  const rot=t*14;
  // ring + spokes
  const rk=eo(seg(t,1.2,1.8));
  const ringR=L(R,250,morph);
  g+=`<circle cx="${CX}" cy="${CY}" r="${ringR}" fill="none" stroke="${SKY}" stroke-width="3" stroke-dasharray="10 14" stroke-dashoffset="${-t*40}" opacity="${rk*.8}"/>`;
  for(let k=0;k<3;k++){const q=((t*.6)+k/3)%1;g+=`<circle cx="${CX}" cy="${CY}" r="${ringR+q*170}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${(1-q)*.3*rk}"/>`}
  // modules fly in, lock onto the ring, then shrink into orbiting nodes
  MODS.forEach((m,i)=>{
    const a0=(-90+i*72+rot*(t>3.2?1:0)*.6)*Math.PI/180;
    const fx=CX+Math.cos(a0)*900, fy=CY+Math.sin(a0)*900;
    const tx=CX+Math.cos(a0)*ringR, ty=CY+Math.sin(a0)*ringR;
    const k=eio(seg(t,modT(i),modT(i)+.55)); if(k<=0)return;
    const x=L(fx,tx,k), y=L(fy,ty,k), lock=seg(t,modT(i)+.5,modT(i)+.8);
    if(k>=1)g+=`<line x1="${CX}" y1="${CY}" x2="${tx}" y2="${ty}" stroke="${NAVY}" stroke-width="3" stroke-dasharray="6 8" opacity="${.35*(1-morph)}"/>`;
    if(t>3.3&&morph<1){const q=((t-3.3)*1.1+i/5)%1;g+=`<circle cx="${L(tx,CX,q)}" cy="${L(ty,CY,q)}" r="8" fill="${BLUE}" opacity="${Math.sin(q*Math.PI)*(1-morph)}"/>`}
    const en=/[A-Za-z]/.test(m), w=en?190:Math.max(150,56+m.length*17);
    const sc=L(1,.32,morph);
    g+=`<g transform="translate(${x},${y}) scale(${sc})">
      ${lock>0&&lock<1?`<rect x="${-w/2-14}" y="-50" width="${w+28}" height="100" rx="50" fill="none" stroke="${BLUE}" stroke-width="4" opacity="${1-lock}"/>`:''}
      <rect x="${-w/2}" y="-38" width="${w}" height="76" rx="38" fill="${k>=1?BLUE:'#fff'}" stroke="${BLUE}" stroke-width="4" style="filter:drop-shadow(0 10px 18px rgba(31,95,255,.22))"/>
      <text y="12" text-anchor="middle" font-size="${en?30:29}" fill="${k>=1?'#fff':BLUE}" ${en?'class="mono" style="font-weight:600!important"':''} opacity="${1-morph}">${m}</text></g>`;
  });
  // system core -> becomes the product
  const ck=back(C(seg(t,.8,1.3)))*(1-morph);
  if(ck>0.01)g+=`<g transform="translate(${CX},${CY}) scale(${ck*.84})">
    <rect x="-150" y="-150" width="300" height="300" rx="64" fill="${NAVY}" style="filter:drop-shadow(0 22px 44px rgba(31,95,255,.4))"/>
    <rect x="-122" y="-122" width="244" height="244" rx="50" fill="none" stroke="${SKY}" stroke-width="3" stroke-dasharray="14 10" stroke-dashoffset="${t*50}"/>
    <text y="-10" text-anchor="middle" font-size="64" fill="#fff" class="mono" style="font-weight:600!important">E-com</text>
    <text y="44" text-anchor="middle" font-size="30" fill="${SKY}" class="mono">GROWTH SYSTEM</text></g>`;
  const pk=back(C(seg(t,5.0,5.5)));
  if(pk>0){
    g+=`<circle cx="${CX}" cy="${CY}" r="${170*pk}" fill="${BLUE}" opacity=".08"/>`;
    g+=prod('box',CX-10,CY+10,1.25*pk,false,1,Math.sin(t*1.6)*3);
    const lk=back(C(seg(t,5.4,5.8)));
    g+=`<g transform="translate(${CX},${CY-215}) scale(${lk})" opacity="${C(lk*3)}"><rect x="-130" y="-36" width="260" height="72" rx="36" fill="#fff" stroke="${NAVY}" stroke-width="4"/>
      <text y="12" text-anchor="middle" font-size="34" fill="${NAVY}">نفس المنتج</text></g>`;
  }
  // monthly sales
  const sk=back(C(seg(t,5.8,6.3))), v=1.2e6*eio(seg(t,6.3,9.6)), hit=t>=9.6, hk=seg(t,9.6,10.0);
  const punch=hit?1+.08*Math.sin(hk*Math.PI):1;
  if(t>6.3&&t<9.9)for(let i=0;i<3;i++){const q=((t-6.3)*1.3+i/3)%1;
    g+=`<g transform="translate(${L(CX+(i-1)*70,CX+(i-1)*150,q)},${L(CY+150,1440,q)})" opacity="${Math.sin(q*Math.PI)}"><circle r="20" fill="${BLUE}"/><text y="7" text-anchor="middle" font-size="20" fill="#fff">ج</text></g>`}
  g+=`<g transform="translate(540,1520) scale(${sk*punch})" opacity="${C(sk*3)}">
    <rect x="-440" y="-130" width="880" height="260" rx="40" fill="#fff" stroke="${hit?BLUE:NAVY}" stroke-width="${hit?6:4}" style="filter:drop-shadow(0 18px 36px rgba(${hit?'31,95,255,.30':'11,31,77,.14'}))"/>
    <text x="390" y="-70" text-anchor="end" font-size="34" fill="${GDK}">المبيعات الشهرية</text>
    <text x="-50" y="50" text-anchor="middle" font-size="116" fill="${hit?BLUE:NAVY}" style="direction:ltr">${fmt(Math.round(v/1000)*1000)}</text>
    <text x="330" y="44" text-anchor="middle" font-size="36" fill="${GDK}">ج.م / شهر</text></g>`;
  if(hit){
    for(let k=0;k<3;k++){const q=C((t-9.6-k*.18)/1.1);if(q>0&&q<1)g+=`<rect x="${100-q*70}" y="${1390-q*70}" width="${880+q*140}" height="${260+q*140}" rx="${40+q*40}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${(1-q)*.5}"/>`}
    for(let i=0;i<26;i++){const a=i*2.3,q=seg(t,9.6,11.2),r=q*(380+(i%5)*50);
      const x=540+Math.cos(a)*r,y=1400+Math.sin(a)*r*.6+q*q*200;
      g+=`<rect x="${x}" y="${y}" width="14" height="${8+(i%3)*4}" rx="3" fill="${i%3?BLUE:i%2?SKY:NAVY}" transform="rotate(${i*40+q*400} ${x} ${y})" opacity="${1-q}"/>`}
  }
  // headlines
  const out1=seg(t,4.2,4.5);
  if(t<4.5)html+=`<div class="abs ar" style="left:30px;right:30px;top:300px;font-size:80px;line-height:1.3;opacity:${1-out1};filter:blur(${out1*10}px);transform:translateY(${-out1*40}px)">
    ${wd('احنا',t,.3)} ${wd('بنينا',t,.5)} ${wd('ليه',t,.7)}<br><span class="iso">${wd('E-com',t,1.0,'#1f5fff')} ${wd('Growth',t,1.2,'#1f5fff')} ${wd('System',t,1.4,'#1f5fff')}</span></div>`;
  if(t>=4.4)html+=`<div class="abs ar" style="left:30px;right:30px;top:300px;font-size:72px;line-height:1.3">
    ${wd('نفس',t,4.5)} ${wd('المنتج،',t,4.7)}<br>${wd('بس',t,5.6)} ${wd('بقى',t,5.76)} ${wd('بيبيع',t,5.92)} ${wd('بـ1.2',t,6.1,'#1f5fff')} ${wd('مليون',t,6.3,'#1f5fff')}<br>${wd('في',t,6.5)} ${wd('الشهر',t,6.66,'#1f5fff')}</div>`;
  const drift=1+seg(t,0,DUR)*.02;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // E-COM GROWTH SYSTEM</div>
    <div class="lbl abs" style="right:70px;top:110px">00:${String(Math.floor(t)).padStart(2,'0')} / 00:11</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${g}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
