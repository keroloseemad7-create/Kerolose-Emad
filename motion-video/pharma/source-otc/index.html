<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=8.5;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GRAY='#b3bbcb',GDK='#8b95a8';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*30}px)">${w}</span>`;
}
</script>
<script src="prod.js"></script>
<script>
const KINDS=['box','bottle','tube','box','bottle'];
const SH=[[140,940],[1000],[1240],[1480]]; // shelf x-range, then shelf baselines
const ROWS=[1000,1240,1480], COLS=[860,700,540,380,220]; // RTL: fill from the right
function store(x,y,k,t,i){
  const sway=Math.sin(t*3+i)*2;
  return `<g transform="translate(${x},${y}) scale(${k})">
    <rect x="-70" y="-30" width="140" height="100" rx="6" fill="#fff" stroke="${NAVY}" stroke-width="4"/>
    <path d="M-80 -30 L-70 -62 L70 -62 L80 -30 Z" fill="${BLUE}"/>
    ${[0,1,2,3].map(j=>`<path d="M${-80+j*40} -30 Q${-60+j*40} ${-14+sway} ${-40+j*40} -30" fill="${j%2?'#fff':BLUE}" stroke="${BLUE}" stroke-width="2"/>`).join('')}
    <rect x="-16" y="20" width="32" height="50" rx="3" fill="#eef2fb" stroke="${NAVY}" stroke-width="3"/>
    <rect x="-56" y="0" width="30" height="30" rx="4" fill="#eef2fb" stroke="${NAVY}" stroke-width="3"/>
    <g transform="translate(40,14)"><rect x="-5" y="-14" width="10" height="28" rx="2" fill="${BLUE}"/><rect x="-14" y="-5" width="28" height="10" rx="2" fill="${BLUE}"/></g>
  </g>`;
}
function pin(x,y,k){return `<g transform="translate(${x},${y-L(120,0,eo(C(k)))})" opacity="${C(k*3)}"><path d="M0 0 C-30 -34 -30 -70 0 -70 C30 -70 30 -34 0 0 Z" fill="${NAVY}"/><circle cy="-44" r="11" fill="#fff"/></g>`}

function render(t){
  let g='',svg='';
  // ---------- shelf unit
  const fk=eo(seg(t,.5,1.1));
  g+=`<g opacity="${fk}">
    <rect x="130" y="${L(800,720,fk)}" width="820" height="80" rx="20" fill="${NAVY}"/>
    <g transform="translate(540,${L(800,720,fk)+40})"><rect x="-12" y="-26" width="24" height="52" rx="4" fill="${BLUE}"/><rect x="-26" y="-12" width="52" height="24" rx="4" fill="${BLUE}"/></g>
    <text x="900" y="${L(800,720,fk)+54}" text-anchor="end" font-size="36" fill="#fff">صيدلية</text>
    <text x="180" y="${L(800,720,fk)+52}" font-size="30" fill="${SKY}" class="mono">OTC</text>
    <rect x="140" y="800" width="800" height="${740*fk}" rx="10" fill="#f6f8fd" stroke="${NAVY}" stroke-width="4"/>
    ${ROWS.map(y=>`<rect x="140" y="${y}" width="${800*eo(seg(t,.8,1.3))}" height="16" fill="${NAVY}"/>`).join('')}
  </g>`;
  // ---------- products slide in, row by row
  ROWS.forEach((ry,r)=>COLS.forEach((cx,c)=>{
    const st=1.2+r*.35+c*.09, k=eo(seg(t,st,st+.45));if(k<=0)return;
    const kind=KINDS[(c+r*2)%5], from=r%2?-1:1;
    const x=L(cx+from*500,cx,k);
    g+=prod(kind,x,ry-62,.5,false,C(k*3),(1-k)*from*-25);
    // shelf tag
    g+=`<g opacity="${seg(t,st+.3,st+.5)}"><rect x="${cx-34}" y="${ry+20}" width="68" height="28" rx="6" fill="${BLUE}"/><text x="${cx}" y="${ry+41}" text-anchor="middle" font-size="18" fill="#fff" class="mono">OTC</text></g>`;
    // scan check (scanner sweeps right -> left)
    const sx=L(960,120,eio(seg(t,3.4,4.6)));
    if(sx<cx){const ck=back(C((t-(3.4+(960-cx)/840*1.2))/.3));
      g+=`<g transform="translate(${cx+38},${ry-122}) scale(${ck})"><circle r="20" fill="${BLUE}" style="filter:drop-shadow(0 0 6px rgba(31,95,255,.6))"/><path d="M-8 0 L-2 6 L9 -6" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}
  }));
  // scanner beam
  const sp=seg(t,3.4,4.6);
  if(sp>0&&sp<1){const sx=L(960,120,eio(sp));
    g+=`<rect x="${sx-60}" y="810" width="120" height="680" fill="url(#beam)"/><line x1="${sx}" y1="810" x2="${sx}" y2="1490" stroke="${BLUE}" stroke-width="5" style="filter:drop-shadow(0 0 10px ${BLUE})"/>`}
  // "in stock" badge
  const ib=back(C(seg(t,4.6,5.0)));
  g+=`<g transform="translate(540,1590) scale(${ib})" opacity="${C(ib*3)*(1-seg(t,5.3,5.6))}"><rect x="-170" y="-46" width="340" height="92" rx="46" fill="${BLUE}" style="filter:drop-shadow(0 14px 26px rgba(31,95,255,.35))"/>
    <text x="-20" y="14" text-anchor="middle" font-size="40" fill="#fff">متاح فعلًا</text><circle cx="116" r="26" fill="#fff"/><path d="M104 0 L113 9 L130 -9" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;

  // ---------- zoom out: shelf becomes one point in the market
  const z=eio(seg(t,5.3,6.1)), zs=L(1,.5,z), zy=L(0,-160,z);
  svg+=`<defs><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="${BLUE}" stop-opacity="0"/><stop offset=".5" stop-color="${BLUE}" stop-opacity=".18"/><stop offset="1" stop-color="${BLUE}" stop-opacity="0"/></linearGradient></defs>`;
  if(z>0){
    const ST=[[200,1420],[420,1560],[660,1560],[880,1420],[540,1760]];
    ST.forEach(([x,y],i)=>{const k=back(C(seg(t,6.0+i*.16,6.45+i*.16)));
      const lk=eo(seg(t,6.2+i*.16,6.6+i*.16));
      svg+=`<line x1="540" y1="1170" x2="${L(540,x,lk)}" y2="${L(1170,y-70,lk)}" stroke="${NAVY}" stroke-width="3" stroke-dasharray="6 8" opacity=".4"/>`;
      if(t>6.7)svg+=`<circle cx="${L(540,x,((t*.8)+i*.2)%1)}" cy="${L(1170,y-70,((t*.8)+i*.2)%1)}" r="7" fill="${BLUE}" opacity="${Math.sin(((t*.8)+i*.2)%1*Math.PI)}"/>`;
      svg+=store(x,y,.8*k,t,i)+pin(x+52,y-56,seg(t,6.3+i*.16,6.7+i*.16));
    });
  }
  svg+=`<g transform="translate(0,${zy}) translate(540,1150) scale(${zs}) translate(-540,-1150)">${g}</g>`;
  if(z>0)for(let k=0;k<2;k++){const p=((t-6)*.7+k*.5)%1;if(t>6)svg+=`<circle cx="540" cy="990" r="${230+p*160}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${(1-p)*.35}"/>`}

  const html=`<div class="abs ar" style="left:30px;right:30px;top:330px;font-size:88px;line-height:1.3">
     ${wd('منتجات',t,.3)} <span style="direction:ltr;unicode-bidi:isolate;display:inline-block">${wd('OTC',t,.55,'#1f5fff')}</span><br>
     <span style="font-size:72px">${wd('موجودة',t,.95)} ${wd('فعلًا',t,1.2,'#1f5fff')} ${wd('في',t,1.45)} ${wd('السوق',t,1.65)}</span></div>`;
  const drift=1+seg(t,0,DUR)*.025;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // OTC MARKET</div>
    <div class="lbl abs" style="right:70px;top:110px">00:0${Math.floor(t)} / 00:08</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${svg}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
