<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.mono{font-family:'JetBrains Mono',monospace!important;font-weight:400!important}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=12;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GRAY='#b3bbcb',GDK='#8b95a8';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,col){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${col||mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*30}px)">${w}</span>`;
}
// items: string | {w,c} | {g:[...],c} (an LTR English phrase inside the RTL line)
function line(items,t,t0,dt=.22){let j=0;return items.map(it=>{
  if(typeof it==='string')return wd(it,t,t0+(j++)*dt);
  if(it.g)return `<span style="direction:ltr;unicode-bidi:isolate;display:inline-block">${it.g.map(w=>wd(w,t,t0+(j++)*dt,it.c)).join(' ')}</span>`;
  return wd(it.w,t,t0+(j++)*dt,it.c)}).join(' ')}

function packets(x1,y1,x2,y2,t,speed,n,op){let s='';for(let k=0;k<n;k++){const p=((t*speed)+k/n)%1;
  s+=`<circle cx="${L(x1,x2,p)}" cy="${L(y1,y2,p)}" r="7" fill="${BLUE}" opacity="${op*Math.sin(p*Math.PI)}" style="filter:drop-shadow(0 0 6px ${BLUE})"/>`}return s}
function chip(x,y,k,icon,label,t){
  const s=`stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const ic={ads:`<path d="M-24 -8 L-6 -8 L18 -24 L18 24 L-6 8 L-24 8 Z" ${s}/>`,
    play:`<rect x="-26" y="-20" width="52" height="40" rx="8" ${s}/><path d="M-6 -9 L10 0 L-6 9 Z" fill="${BLUE}"/>`,
    search:`<circle cx="-4" cy="-4" r="16" ${s}/><line x1="8" y1="8" x2="22" y2="22" ${s}/>`}[icon];
  const pulse=(Math.sin(t*4+x)+1)/2;
  return `<g transform="translate(${x},${y}) scale(${k})"><circle r="${66+pulse*6}" fill="${BLUE}" opacity=".08"/><circle r="56" fill="#fff" stroke="${NAVY}" stroke-width="4"/>${ic}
    <text y="96" text-anchor="middle" font-size="24" fill="${SKY}" class="mono">${label}</text></g>`;
}
function block(y,k,kind,label,sub,t){
  const s=`stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const ic={page:`<rect x="-40" y="-30" width="80" height="60" rx="8" ${s}/><line x1="-40" y1="-14" x2="40" y2="-14" ${s}/><rect x="-22" y="4" width="44" height="14" rx="7" fill="${BLUE}"/>`,
    orders:`<path d="M-30 -14 L30 -14 L24 30 L-24 30 Z" ${s}/><path d="M-14 -14 Q-14 -34 0 -34 Q14 -34 14 -14" ${s}/><path d="M-10 8 L-2 16 L12 0" ${s}/>`,
    ship:`<rect x="-38" y="-22" width="44" height="34" rx="4" ${s}/><path d="M6 -10 L24 -10 L36 4 L36 12 L6 12" ${s}/><circle cx="-22" cy="20" r="8" ${s}/><circle cx="24" cy="20" r="8" ${s}/><path d="M-58 -10 L-46 -10 M-62 2 L-46 2" ${s} opacity="${.4+.6*Math.abs(Math.sin(t*6))}"/>`}[kind];
  const drop=L(-260,0,back(C(k))), op=C(k*4);
  return `<g transform="translate(540,${y+drop})" opacity="${op}">
    <rect x="-230" y="-72" width="460" height="144" rx="30" fill="#fff" stroke="${NAVY}" stroke-width="4" style="filter:drop-shadow(0 14px 26px rgba(11,31,77,.16))"/>
    <g transform="translate(150,0)">${ic}</g>
    <text x="${label.length>10?76:70}" y="4" text-anchor="end" font-size="${label.length>10?28:44}" fill="${NAVY}" class="mono" style="font-weight:600!important">${label}</text>
    <text x="${label.length>10?76:70}" y="44" text-anchor="end" font-size="26" fill="${GDK}">${sub}</text></g>`;
}
// offline illustrations (gray)
function offline(t,op,dim){
  const g=GDK,s=`stroke="${g}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const k=i=>back(C(seg(t,5.9+i*.25,6.4+i*.25)));
  const walk=Math.sin(t*5)*6;
  return `<g opacity="${op}" style="filter:grayscale(${dim}) blur(${dim*1.5}px)">
    <g transform="translate(270,${880+walk*.3}) scale(${k(0)})"><circle r="78" fill="#eef1f6"/><circle cy="-22" r="22" ${s}/><path d="M-36 40 Q-36 4 0 4 Q36 4 36 40" ${s}/><rect x="26" y="20" width="34" height="28" rx="4" fill="${GRAY}"/><path d="M36 20 L36 12 L50 12 L50 20" ${s} stroke-width="4"/>
      <text y="128" text-anchor="middle" font-size="30" fill="${g}">زيارات مندوب</text></g>
    <g transform="translate(270,1140) scale(${k(1)})"><circle r="78" fill="#eef1f6"/>
      <g transform="rotate(${-8+Math.sin(t*2)*3})"><rect x="-28" y="-36" width="56" height="72" rx="4" fill="#fff" ${s} stroke-width="4"/><line x1="-16" y1="-18" x2="16" y2="-18" ${s} stroke-width="4"/><line x1="-16" y1="-4" x2="16" y2="-4" ${s} stroke-width="4"/><line x1="-16" y1="10" x2="6" y2="10" ${s} stroke-width="4"/></g>
      <text y="128" text-anchor="middle" font-size="30" fill="${g}">ورق وبروشورات</text></g>
    <g transform="translate(270,1400) scale(${k(2)})"><circle r="78" fill="#eef1f6"/><path d="M-34 34 L-34 -14 L0 -36 L34 -14 L34 34 Z" ${s}/><path d="M-6 -12 L6 -12 M0 -18 L0 -6" ${s} stroke-width="5"/><rect x="-10" y="12" width="20" height="22" ${s} stroke-width="4"/>
      <text y="128" text-anchor="middle" font-size="30" fill="${g}">علاقات وعيادات</text></g>
  </g>`;
}
function render(t){
  let svg='',html='';
  // ---------- headlines
  const outA=seg(t,5.0,5.35);
  if(t<5.4)html+=`<div class="abs ar" style="left:30px;right:30px;top:360px;font-size:80px;line-height:1.35;opacity:${1-outA};filter:blur(${outA*10}px);transform:translateY(${-outA*40}px)">
     ${line(['وعايز','تبني',{w:'System',c:'#1f5fff'},'حقيقي'],t,.3)}<br>${line(['لل',{g:['Digital','Acquisition'],c:'#1f5fff'}],t,1.2)}</div>`;
  if(t>=5.3)html+=`<div class="abs ar" style="left:30px;right:30px;top:390px;font-size:70px;line-height:1.35">
     ${line(['بدل','الاعتماد','الأساسي'],t,5.4)}<br>${line(['على',{w:'الـOffline…',c:'#8b95a8'}],t,6.1)}</div>`;

  // ---------- digital system (builds in part A, moves right in part B)
  const side=eio(seg(t,5.5,6.3));
  const sx=L(0,200,side), ss=L(1,.74,side);
  let g='';
  const srcX=[310,540,770],srcY=760;
  const ck=i=>back(C(seg(t,.6+i*.18,1.1+i*.18)));
  const blocks=[[1010,'page','Landing','صفحة هبوط'],[1250,'orders','Orders','الطلبات'],[1490,'ship','Shipping company','شركة الشحن']];
  const bk=i=>seg(t,1.6+i*.45,2.2+i*.45);
  // connectors + packets
  srcX.forEach((x,i)=>{const lk=eo(seg(t,2.0+i*.1,2.4+i*.1));
    g+=`<line x1="${x}" y1="${srcY+60}" x2="${L(x,540,lk)}" y2="${L(srcY+60,1010-72,lk)}" stroke="${NAVY}" stroke-width="3" stroke-dasharray="6 8" opacity=".45"/>`;
    if(t>2.6)g+=packets(x,srcY+60,540,1010-72,t+i*.2,.9,2,1)});
  for(let i=0;i<2;i++){const y1=blocks[i][0]+72,y2=blocks[i+1][0]-72,lk=eo(seg(t,2.4+i*.4,2.8+i*.4));
    g+=`<line x1="540" y1="${y1}" x2="540" y2="${L(y1,y2,lk)}" stroke="${NAVY}" stroke-width="3" stroke-dasharray="6 8" opacity=".45"/>`;
    if(t>3.0)g+=packets(540,y1,540,y2,t+i*.3,1.1,2,1)}
  srcX.forEach((x,i)=>g+=chip(x,srcY,ck(i),['ads','play','search'][i],['ADS','CONTENT','SEARCH'][i],t));
  blocks.forEach((b,i)=>g+=block(b[0],bk(i),b[1],b[2],b[3],t));
  // pipeline bar fills as the system runs
  const pk=seg(t,3.2,3.5), fill=eio(seg(t,3.4,9.0));
  g+=`<g opacity="${pk}"><text x="770" y="1640" text-anchor="end" font-size="28" fill="${NAVY}" class="mono">PIPELINE</text>
     <rect x="310" y="1660" width="460" height="22" rx="11" fill="#eef2fb"/><rect x="${310+460*(1-fill)}" y="1660" width="${460*fill}" height="22" rx="11" fill="${BLUE}" style="filter:drop-shadow(0 0 8px rgba(31,95,255,.5))"/></g>`;
  // "Digital" verdict badge in part B
  const dv=back(C(seg(t,9.0,9.5)));
  g+=`<g transform="translate(540,1790) scale(${dv})" opacity="${C(dv*3)}"><rect x="-150" y="-46" width="300" height="92" rx="46" fill="${BLUE}" style="filter:drop-shadow(0 14px 26px rgba(31,95,255,.35))"/>
     <text x="-24" y="14" text-anchor="middle" font-size="40" fill="#fff" class="mono" style="font-weight:600!important">Digital</text><circle cx="96" r="26" fill="#fff"/><path d="M84 0 L93 9 L110 -9" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  svg+=`<g transform="translate(${sx},0) translate(540,1150) scale(${ss}) translate(-540,-1150)">${g}</g>`;

  // ---------- offline side (part B)
  if(t>5.8){
    const dim=eio(seg(t,8.3,9.0));
    svg+=offline(t,L(1,.45,dim),dim);
    svg+=`<text x="270" y="1660" text-anchor="middle" font-size="40" fill="${GDK}" class="mono" opacity="${seg(t,6.8,7.1)}">Offline</text>`;
    // strike through the offline column
    const sk=eio(seg(t,8.3,8.8));
    svg+=`<line x1="110" y1="760" x2="${L(110,430,sk)}" y2="${L(760,1700,sk)}" stroke="${NAVY}" stroke-width="8" stroke-linecap="round" opacity="${sk>0?.8:0}"/>`;
    // arrow offline -> digital ("بدل")
    const ak=eio(seg(t,7.4,8.1));
    svg+=`<g opacity="${ak>0?1:0}"><path d="M420 1150 L${L(420,560,ak)} 1150" stroke="${BLUE}" stroke-width="8" stroke-linecap="round"/>
      <path d="M${L(420,560,ak)-18} 1132 L${L(420,560,ak)} 1150 L${L(420,560,ak)-18} 1168" stroke="${BLUE}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${seg(t,7.9,8.1)}"/>
      <text x="490" y="1120" text-anchor="middle" font-size="34" fill="${BLUE}" opacity="${seg(t,7.8,8.1)}">بدل</text></g>`;
  }
  const drift=1+seg(t,0,DUR)*.025;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // DIGITAL ACQUISITION</div>
    <div class="lbl abs" style="right:70px;top:110px">00:${String(Math.floor(t)).padStart(2,'0')} / 00:12</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${svg}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
