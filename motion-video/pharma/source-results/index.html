<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--navy:#0b1f4d;--blue:#1f5fff;--sky:#7ea6ff;--dim:#8592a8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--dim);letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:var(--navy);direction:rtl;text-align:center}
.w{display:inline-block}
.num{font-family:Cairo,sans-serif;font-weight:800;direction:ltr;display:inline-block}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=9.5;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY=[11,31,77],BLUE=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
// word reveal: blur + rise, fresh word blue, settles to navy (or stays blue)
function wd(w,t,t0,stay){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${stay?'#1f5fff':mix(BLUE,NAVY,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*30}px);text-shadow:0 0 ${L(24,6,s)}px rgba(31,95,255,${stay?.3:L(.4,.08,s)})">${w}</span>`;
}
const fmt=v=>v>=4.995?'5':v.toFixed(1);
function render(t){
  const drift=1+seg(t,0,DUR)*.03;
  // ---- part 1: before
  const n1=eio(seg(t,.6,1.6))*1.3;
  const n1k=eo(seg(t,.55,.9));
  const p1=`
   <div class="abs ar" style="left:0;right:0;top:250px;font-size:72px">${wd('بحوالي',t,.3)}</div>
   <div class="abs ar" style="left:0;right:0;top:340px;height:250px;display:flex;justify-content:center;align-items:baseline;gap:28px">
     <span class="num" style="font-size:230px;line-height:250px;color:#0b1f4d;opacity:${n1k};filter:blur(${(1-n1k)*12}px)">${n1.toFixed(1)}</span>
     <span style="font-size:72px">${wd('مليون',t,1.05)} ${wd('جنيه',t,1.25)}</span></div>
   <div class="abs ar" style="left:0;right:0;top:600px;font-size:64px;color:#3a4a70">${wd('مبيعات',t,1.6)} ${wd('في',t,1.8)} ${wd('السنة…',t,2.0)}</div>`;
  // ---- connector: line sweeps down with glowing head
  const lk=eio(seg(t,2.6,3.3)), y0=720, y1=900;
  const conn=`
   <div class="abs" style="left:538px;top:${y0}px;width:5px;height:${(y1-y0)*lk}px;border-radius:3px;background:linear-gradient(rgba(11,31,77,.15),#1f5fff);box-shadow:0 0 16px rgba(31,95,255,.5)"></div>
   <div class="abs" style="left:${540-70}px;top:${y0+(y1-y0)*lk-70}px;width:140px;height:140px;background:radial-gradient(circle,rgba(70,130,255,.95),rgba(31,95,255,.35) 28%,transparent 62%);opacity:${lk>0&&lk<1?1:0}"></div>
   <svg class="abs" style="left:510px;top:${y1-6}px" width="60" height="40" opacity="${seg(t,3.2,3.4)}"><path d="M8 6 L30 28 L52 6" fill="none" stroke="#1f5fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  // ---- part 2: after
  const n2=t<3.9?1.3:L(1.3,5,eio(seg(t,3.9,5.3)));
  const n2k=eo(seg(t,3.85,4.2)), punch=t>5.3?1+.12*Math.sin(seg(t,5.3,5.75)*Math.PI):1;
  let rings='';
  if(t>5.3)for(let k=0;k<3;k++){const p=C((t-5.3-k*.18)/1.1);if(p>0&&p<1)rings+=`<div class="abs" style="left:${540-160-p*220}px;top:${1170-160-p*220}px;width:${320+p*440}px;height:${320+p*440}px;border-radius:50%;border:3px solid rgba(31,95,255,${(1-p)*.5})"></div>`}
  const pill=back(C(seg(t,6.0,6.45)));
  const p2=`${rings}
   <div class="abs ar" style="left:0;right:0;top:960px;font-size:72px">${wd('ووصلناه',t,3.4)} ${wd('لـ',t,3.62)}</div>
   <div class="abs ar" style="left:0;right:0;top:1050px;height:300px;display:flex;justify-content:center;align-items:baseline;gap:28px">
     <span class="num" style="font-size:300px;line-height:300px;color:#1f5fff;opacity:${n2k};filter:blur(${(1-n2k)*12}px);transform:scale(${punch});text-shadow:0 0 40px rgba(31,95,255,.35)">${fmt(n2)}</span>
     <span style="font-size:80px">${wd('مليون',t,5.0,1)} ${wd('جنيه',t,5.2,1)}</span></div>
   <div class="abs ar" style="left:0;right:0;top:1370px;font-size:70px;display:flex;justify-content:center;align-items:center;gap:22px">
     ${wd('خلال',t,5.7)}
     <span class="w" style="background:#1f5fff;color:#fff;border-radius:26px;padding:0 34px;transform:scale(${pill});opacity:${C(pill*3)};box-shadow:0 14px 34px rgba(31,95,255,.35)">6 شهور</span>
     <span class="w" style="color:#1f5fff;opacity:${seg(t,6.4,6.55)};transform:rotate(${(1-eo(seg(t,6.4,6.8)))*-30}deg) scale(${back(C(seg(t,6.4,6.8)))})">!</span></div>`;
  // ---- comparison bars
  const b1=eo(seg(t,6.8,7.5)),b2=eio(seg(t,7.1,8.1)),bo=seg(t,6.7,6.9);
  const bw=760,bx=(W-bw)/2;
  const bars=`<div class="abs" style="left:${bx}px;top:1560px;width:${bw}px;opacity:${bo}">
     <div class="ar" style="display:flex;justify-content:space-between;font-size:34px;color:#3a4a70"><span>قبل</span><span class="num" style="font-size:34px">1.3M</span></div>
     <div style="height:34px;border-radius:17px;background:#eef2fb;margin:8px 0 26px;direction:rtl"><div style="height:100%;width:${26*b1}%;border-radius:17px;background:#0b1f4d;margin-right:0;margin-left:auto"></div></div>
     <div class="ar" style="display:flex;justify-content:space-between;font-size:34px;color:#1f5fff"><span>بعد 6 شهور</span><span class="num" style="font-size:34px">${b2>0?fmt(L(1.3,5,b2))+'M':''}</span></div>
     <div style="height:34px;border-radius:17px;background:#eef2fb;margin-top:8px;position:relative"><div style="position:absolute;right:0;top:0;height:100%;width:${L(26,100,b2)*C(b2*20)}%;border-radius:17px;background:linear-gradient(270deg,#7ea6ff,#1f5fff);box-shadow:0 0 18px rgba(31,95,255,.45)"></div></div>
   </div>`;
  document.getElementById('stage').innerHTML=`
   <div class="lbl abs" style="left:70px;top:110px">PGS // RESULTS</div>
   <div class="lbl abs" style="right:70px;top:110px">00:0${Math.floor(t)} / 00:09</div>
   <div class="abs" style="inset:0;transform:scale(${drift});transform-origin:50% 50%">${p1}${conn}${p2}${bars}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
