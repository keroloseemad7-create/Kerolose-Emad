<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-family:'JetBrains Mono',monospace;font-size:24px;color:#8592a8;letter-spacing:.08em}
.ar{font-family:Cairo,sans-serif;font-weight:800;color:#0b1f4d;direction:rtl;text-align:center}
.w{display:inline-block}
svg text{font-family:Cairo,sans-serif;font-weight:800}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=13;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NAVY='#0b1f4d',BLUE='#1f5fff',SKY='#7ea6ff',GRAY='#b3bbcb',GDK='#8b95a8';
const N=[11,31,77],B=[31,95,255];
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(L(v,b[i],k))).join(',')})`;
function wd(w,t,t0,stay){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=eo(C(a/.35)),s=C((a-.15)/.5);
  return `<span class="w" style="opacity:${C(a/.12)};color:${stay?'#1f5fff':mix(B,N,s)};filter:blur(${(1-k)*10}px);transform:translateY(${(1-k)*30}px)">${w}</span>`;
}
const STAGES=[
  {t0:0,  t1:3.0, words:['عميل',{w:'عارفك',b:1}], step:'معرفة'},
  {t0:3.0,t1:6.0, words:['مهتم',{w:'بمنتجاتك',b:1}], step:'اهتمام'},
  {t0:6.0,t1:9.6, words:['بيقارن','بينها','وبين',{w:'منتجات',b:0},'تانيه'], step:'مقارنة'},
  {t0:9.6,t1:13.1,words:['بيقرر',{w:'يشتريها',b:1}], step:'شراء'},
];
// ---------- product drawings (yours = blue, competitor = gray)
function prod(kind,x,y,s,comp,op=1,rot=0){
  const c=comp?GRAY:BLUE, st=comp?GDK:NAVY, cap=comp?GDK:NAVY, fill='#fff';
  let g='';
  if(kind==='box'){
    g=`<path d="M-60 -90 L-32 -114 L88 -114 L60 -90 Z" fill="${comp?'#e3e7ef':'#dfe8ff'}" stroke="${st}" stroke-width="4" stroke-linejoin="round"/>
       <path d="M60 -90 L88 -114 L88 66 L60 90 Z" fill="${comp?'#cfd5e1':'#c4d4ff'}" stroke="${st}" stroke-width="4" stroke-linejoin="round"/>
       <rect x="-60" y="-90" width="120" height="180" rx="6" fill="${fill}" stroke="${st}" stroke-width="4"/>
       <rect x="-60" y="-34" width="120" height="58" fill="${c}"/>
       <rect x="-9" y="-28" width="18" height="46" rx="3" fill="#fff"/><rect x="-23" y="-14" width="46" height="18" rx="3" fill="#fff"/>
       <rect x="-40" y="40" width="80" height="8" rx="4" fill="${comp?'#d6dbe5':'#c4d4ff'}"/><rect x="-40" y="58" width="52" height="8" rx="4" fill="${comp?'#d6dbe5':'#c4d4ff'}"/>
       ${comp?'':`<text x="0" y="-52" text-anchor="middle" font-size="22" fill="${NAVY}">PGS</text>`}`;
  }else if(kind==='bottle'){
    g=`<rect x="-30" y="-124" width="60" height="34" rx="8" fill="${cap}"/>
       <rect x="-22" y="-92" width="44" height="14" fill="${comp?'#d6dbe5':'#c4d4ff'}"/>
       <rect x="-58" y="-80" width="116" height="172" rx="30" fill="${fill}" stroke="${st}" stroke-width="4"/>
       <rect x="-58" y="-26" width="116" height="66" fill="${c}"/>
       <g transform="rotate(-30)"><rect x="-26" y="-2" width="52" height="22" rx="11" fill="#fff"/><rect x="0" y="-2" width="26" height="22" rx="11" fill="${comp?'#e3e7ef':'#c4d4ff'}"/></g>`;
  }else{ // tube
    g=`<path d="M-56 -100 L56 -100 L38 76 L-38 76 Z" fill="${fill}" stroke="${st}" stroke-width="4" stroke-linejoin="round"/>
       <path d="M-56 -100 L56 -100" stroke="${st}" stroke-width="10"/>
       <path d="M-50 -40 L50 -40 L44 18 L-44 18 Z" fill="${c}"/>
       <rect x="-24" y="76" width="48" height="40" rx="6" fill="${cap}"/>
       <rect x="-30" y="-78" width="60" height="8" rx="4" fill="${comp?'#d6dbe5':'#c4d4ff'}"/>`;
  }
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})" opacity="${op}" style="filter:drop-shadow(0 18px 24px rgba(11,31,77,${comp?.10:.18}))">${g}</g>`;
}
// ---------- customer avatar; look = -1..1 moves pupils
function avatar(x,y,s,look,op=1){
  return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}">
    <circle r="150" fill="${BLUE}" opacity=".07"/>
    <path d="M-100 150 Q-100 40 0 40 Q100 40 100 150 Z" fill="${NAVY}"/>
    <circle cy="-30" r="66" fill="#fff" stroke="${NAVY}" stroke-width="7"/>
    <circle cx="${-22+look*10}" cy="-34" r="9" fill="${NAVY}"/><circle cx="${22+look*10}" cy="-34" r="9" fill="${NAVY}"/>
    <path d="M-18 0 Q0 14 18 0" stroke="${NAVY}" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>`;
}
function heart(x,y,s,op){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><path d="M0 18 C-30 -4 -26 -30 -8 -30 C0 -30 0 -22 0 -20 C0 -22 0 -30 8 -30 C26 -30 30 -4 0 18 Z" fill="${BLUE}"/></g>`}

function render(t){
  let svg='',html='';
  const si=STAGES.findIndex(s=>t>=s.t0&&t<s.t1);
  // ---- stepper (RTL: first step on the right)
  const xs=[900,660,420,180], prog=C((t-0.3)/(9.9-0.3));
  svg+=`<line x1="900" y1="250" x2="180" y2="250" stroke="#e3e8f3" stroke-width="6" stroke-linecap="round"/>
        <line x1="900" y1="250" x2="${900-720*eio(C(si/3+seg(t,STAGES[si].t0,STAGES[si].t0+.6)*0))}" y2="250" stroke="${BLUE}" stroke-width="6" stroke-linecap="round"/>`;
  // animate line segment between steps on each stage change
  const segK=si>0?eio(seg(t,STAGES[si].t0,STAGES[si].t0+.6)):1;
  const lineTo=900-240*(Math.max(0,si-1)+ (si>0?segK:0));
  svg=svg.replace(/x2="[\d.\-]+" y2="250" stroke="#1f5fff"/,`x2="${lineTo}" y2="250" stroke="#1f5fff"`);
  STAGES.forEach((s,i)=>{const on=i<si||(i===si&&(i===0?t>.3:segK>.9)),cur=i===si;
    const pk=cur?back(C(seg(t,s.t0+(i?0.55:0.3),s.t0+(i?0.95:0.7)))):1;
    svg+=`${cur?`<circle cx="${xs[i]}" cy="250" r="${26+((t*1.2)%1)*26}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${1-((t*1.2)%1)}"/>`:''}
      <circle cx="${xs[i]}" cy="250" r="${on?22*pk:18}" fill="${on?BLUE:'#fff'}" stroke="${on?BLUE:'#cfd6e4'}" stroke-width="5"/>
      ${on?`<path d="M${xs[i]-9} 250 L${xs[i]-2} 257 L${xs[i]+10} 243" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${i<si?1:0}"/>`:''}
      <text x="${xs[i]}" y="318" text-anchor="middle" font-size="30" fill="${on?NAVY:'#b0b8c8'}">${s.step}</text>`});
  // ---- headline per stage
  STAGES.forEach((s,i)=>{
    if(t<s.t0||t>s.t1)return;const out=i<3?seg(t,s.t1-.3,s.t1):0;
    const ws=s.words.map((w,j)=>{const o=typeof w==='string'?{w}:w;return wd(o.w,t,s.t0+.35+j*.22,o.b)}).join(' ');
    html+=`<div class="abs ar" style="left:40px;right:40px;top:400px;font-size:${i===2?70:86}px;line-height:1.3;opacity:${1-out};filter:blur(${out*10}px);transform:translateY(${-out*40}px)">${ws}</div>`;
  });

  // ---- avatar: big in stage 1, then sits at the bottom watching
  const am=eio(seg(t,2.8,3.5)), ain=back(C(seg(t,.2,.8)));
  let look=0;
  if(t>6.3&&t<9.4)look=Math.sin((t-6.3)*3.2)*0.9;      // looks left/right while comparing
  if(t>9.6)look=L(look,.9,seg(t,9.6,10));                // settles on your product
  const ax=L(540,540,am), ay=L(1080,1640,am), as=L(1.35,.75,am)*ain;
  svg+=avatar(ax,ay,as,t<2.8?L(0,.8,seg(t,1.3,1.7)):look);
  if(am>0.5)svg+=`<text x="540" y="1790" text-anchor="middle" font-size="30" fill="${NAVY}" opacity="${seg(t,3.3,3.6)}">العميل</text>`;

  // ---- stage 1: your product comes into view, line of sight + "knows you" ping
  if(t<3.3){
    const pk=back(C(seg(t,.9,1.4))), o=1-seg(t,2.8,3.2);
    svg+=`<line x1="${540+80}" y1="1040" x2="${L(620,820,eo(seg(t,1.3,1.8)))}" y2="${L(1040,960,eo(seg(t,1.3,1.8)))}" stroke="${SKY}" stroke-width="4" stroke-dasharray="8 10" stroke-dashoffset="${-t*40}" opacity="${o}"/>`;
    svg+=prod('box',860,940,.9*pk,false,o,Math.sin(t*2)*3);
    const pg=seg(t,1.8,2.2);
    svg+=`<g transform="translate(860,760) scale(${back(pg)})" opacity="${o*C(pg*3)}"><rect x="-90" y="-36" width="180" height="64" rx="32" fill="${BLUE}"/><text y="10" text-anchor="middle" font-size="30" fill="#fff">👁 شافك</text></g>`;
    for(let k=0;k<2;k++){const p=((t-1.4)*.8+k*.5)%1; if(t>1.4)svg+=`<circle cx="860" cy="940" r="${100+p*120}" fill="none" stroke="${BLUE}" stroke-width="3" opacity="${(1-p)*.4*o}"/>`}
  }
  // ---- stage 2: your products fan out, hearts float up
  if(t>=3.0&&t<6.3){
    const o=1-seg(t,5.8,6.2);
    const P=[['tube',300,1000,-8],['box',540,960,0],['bottle',780,1000,8]];
    P.forEach(([k,x,y,r],i)=>{const a=back(C(seg(t,3.4+i*.18,3.9+i*.18)));
      svg+=prod(k,x,y+Math.sin(t*2+i)*8,.95*a,false,o*C(a*2),r)});
    for(let i=0;i<6;i++){const st=4.2+i*.28,p=seg(t,st,st+1.3);
      if(p>0&&p<1)svg+=heart(300+((i*2)%3)*240+Math.sin(p*6+i)*20,820-p*240,1.2*back(C(p*4)),o*(1-p))}
    // interest meter
    const mk=eio(seg(t,4.0,5.4));
    svg+=`<g opacity="${o*seg(t,3.8,4.0)}"><rect x="290" y="1240" width="500" height="22" rx="11" fill="#eef2fb"/>
      <rect x="${290+500*(1-mk)}" y="1240" width="${500*mk}" height="22" rx="11" fill="${BLUE}"/>
      <text x="790" y="1222" text-anchor="end" font-size="28" fill="${NAVY}">الاهتمام</text>
      <text x="290" y="1222" font-size="28" fill="${BLUE}" style="direction:ltr">${Math.round(mk*100)}%</text></g>`;
  }
  // ---- stage 3: yours vs others + balance
  if(t>=6.0&&t<10.4){
    const inn=eo(seg(t,6.1,6.6)), o3=t<9.6?1:1-seg(t,9.6,10.2);
    const tilt=t<7.6?Math.sin((t-6.6)*4)*6*seg(t,6.6,7):L(0,-10,eio(seg(t,8.4,9.2)))+ (t<8.4?Math.sin((t-6.6)*4)*6:0);
    // yours on the right, competitor on the left
    const bx=540,by=1200, arm=280, ang=tilt*Math.PI/180;
    const rx=bx+arm*Math.cos(ang), ry=by+arm*Math.sin(-ang)*-1, lx=bx-arm*Math.cos(ang), ly=by-arm*Math.sin(ang)*-1;
    const yr=by-Math.sin(ang)*arm, yl=by+Math.sin(ang)*arm;
    svg+=`<g opacity="${inn}">
      <path d="M${bx} ${by} L${bx-50} ${by+230} L${bx+50} ${by+230} Z" fill="#eef2fb" stroke="${NAVY}" stroke-width="4"/>
      <line x1="${bx-arm*Math.cos(ang)}" y1="${yl}" x2="${bx+arm*Math.cos(ang)}" y2="${yr}" stroke="${NAVY}" stroke-width="10" stroke-linecap="round"/>
      <circle cx="${bx}" cy="${by}" r="14" fill="${BLUE}"/>
      <path d="M${bx+arm*Math.cos(ang)-90} ${yr+70} L${bx+arm*Math.cos(ang)+90} ${yr+70} M${bx+arm*Math.cos(ang)} ${yr} L${bx+arm*Math.cos(ang)-80} ${yr+70} M${bx+arm*Math.cos(ang)} ${yr} L${bx+arm*Math.cos(ang)+80} ${yr+70}" stroke="${NAVY}" stroke-width="4" fill="none" opacity="${o3}"/>
      <path d="M${bx-arm*Math.cos(ang)-90} ${yl+70} L${bx-arm*Math.cos(ang)+90} ${yl+70} M${bx-arm*Math.cos(ang)} ${yl} L${bx-arm*Math.cos(ang)-80} ${yl+70} M${bx-arm*Math.cos(ang)} ${yl} L${bx-arm*Math.cos(ang)+80} ${yl+70}" stroke="${GDK}" stroke-width="4" fill="none" opacity="${o3}"/>
    </g>`;
    const ps=.75;
    // your box sits on the right plate (stays for stage 4), competitor on the left
    if(t<9.6) svg+=prod('box',bx+arm*Math.cos(ang),yr-20,ps*back(C(seg(t,6.4,6.9))),false,1);
    svg+=prod('box',bx-arm*Math.cos(ang),yl-20,ps*back(C(seg(t,6.6,7.1))),true,o3*(t>9.6?1-seg(t,9.6,9.9):1));
    // VS badge + score ticks
    const vs=back(C(seg(t,6.9,7.3)));
    svg+=`<g transform="translate(540,1040) scale(${vs})" opacity="${o3}"><circle r="62" fill="${NAVY}"/><text y="18" text-anchor="middle" font-size="52" fill="#fff" style="font-family:'JetBrains Mono'">VS</text></g>`;
    svg+=`<text x="${bx+arm}" y="770" text-anchor="middle" font-size="34" fill="${BLUE}" opacity="${o3*seg(t,7.2,7.5)}">منتجك</text>
          <text x="${bx-arm}" y="770" text-anchor="middle" font-size="34" fill="${GDK}" opacity="${o3*seg(t,7.3,7.6)}">منتج تاني</text>`;
    for(let i=0;i<3;i++){const k=back(C(seg(t,7.6+i*.3,7.9+i*.3)));
      svg+=`<g transform="translate(${bx+arm-70+i*70},840) scale(${k})" opacity="${o3}"><circle r="24" fill="${BLUE}"/><path d="M-10 0 L-3 8 L11 -8" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      const k2=back(C(seg(t,7.75+i*.3,8.05+i*.3)));
      svg+=`<g transform="translate(${bx-arm-70+i*70},840) scale(${k2})" opacity="${o3}"><circle r="24" fill="${i===0?GRAY:'#eef1f6'}" stroke="${GRAY}" stroke-width="3"/>${i===0?`<path d="M-10 0 L-3 8 L11 -8" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:`<path d="M-8 0 L8 0" stroke="${GDK}" stroke-width="4" stroke-linecap="round"/>`}</g>`;
    }
  }
  // ---- stage 4: your product flies into the cart, purchase confirmed
  if(t>=9.6){
    const bx=540+280, startY=1200-Math.sin(-10*Math.PI/180)*280-20;
    const cartIn=eo(seg(t,9.8,10.4)), cx=L(1300,560,cartIn), cy=1180;
    const fly=eio(seg(t,10.4,11.1));
    const px=L(bx,cx,fly), py=L(startY,cy-40,fly)-Math.sin(fly*Math.PI)*260;
    const bounce=t>11.1?Math.sin(seg(t,11.1,11.5)*Math.PI)*-24:0;
    // cart
    svg+=`<g transform="translate(${cx},${cy+bounce})">
      <path d="M-170 -110 L-130 -110 L-90 60 L120 60 L150 -60 L-110 -60" fill="none" stroke="${NAVY}" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-104 -60 L150 -60 L124 40 L-84 40 Z" fill="${BLUE}" opacity=".12"/>
      <circle cx="-60" cy="96" r="22" fill="${NAVY}"/><circle cx="96" cy="96" r="22" fill="${NAVY}"/></g>`;
    if(fly<1)svg+=prod('box',px,py,L(.75,.55,fly),false,1,fly*360*0.25);
    else svg+=prod('box',cx+10,cy-60+bounce,.55,false,1,0);
    // confirmation
    const ok=back(C(seg(t,11.3,11.8)));
    svg+=`<g transform="translate(540,880) scale(${ok})" opacity="${C(ok*3)}"><rect x="-220" y="-56" width="440" height="112" rx="56" fill="${BLUE}" style="filter:drop-shadow(0 16px 30px rgba(31,95,255,.35))"/>
      <circle cx="150" cy="0" r="34" fill="#fff"/><path d="M134 0 L146 12 L168 -12" stroke="${BLUE}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-30" y="18" text-anchor="middle" font-size="50" fill="#fff">تم الشراء</text></g>`;
    // confetti
    if(t>11.3)for(let i=0;i<22;i++){const a=i*2.4,p=seg(t,11.3,12.6),r=p*(220+(i%5)*40);
      svg+=`<rect x="${560+Math.cos(a)*r}" y="${1100+Math.sin(a)*r+p*p*200}" width="14" height="${8+(i%3)*4}" rx="3" fill="${i%3?BLUE:i%2?SKY:NAVY}" transform="rotate(${i*40+p*400} ${560+Math.cos(a)*r} ${1100+Math.sin(a)*r+p*p*200})" opacity="${1-p}"/>`}
  }
  const drift=1+seg(t,0,DUR)*.025;
  document.getElementById('stage').innerHTML=`
    <div class="lbl abs" style="left:70px;top:110px">PGS // CUSTOMER JOURNEY</div>
    <div class="lbl abs" style="right:70px;top:110px">00:${String(Math.floor(t)).padStart(2,'0')} / 00:13</div>
    <div class="abs" style="inset:0;transform:scale(${drift})"><svg class="abs" width="${W}" height="${H}">${svg}</svg>${html}</div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
