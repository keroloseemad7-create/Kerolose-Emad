<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b2a82}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.hd{font-family:Lalezar,Cairo,sans-serif;color:#fff;direction:rtl;text-align:right;white-space:nowrap;line-height:1}
.w{display:inline-block}
.ft{font-family:Cairo,sans-serif;font-weight:800;color:#fff;font-size:30px;direction:rtl;white-space:nowrap}
.iso{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,DUR=10;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, L=(a,b,x)=>a+(b-a)*x;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// 1280-space -> output
const S=.9,OX=20,OY=300;
const BOT={b3:{x:807,y:968,w:247,h:503,t0:.9,rot:-14},b2:{x:718,y:535,w:286,h:492,t0:1.75,rot:12},b1:{x:787,y:77,w:297,h:480,t0:2.6,rot:-16}};
const FALL=.42;
function drop(b,t){ // returns dy (1280 space), rot, alpha, landed-progress
  const a=t-b.t0; if(a<0)return null;
  if(a<FALL){const p=a/FALL;return{dy:-1500*(1-p*p),r:b.rot*(1-p),sq:1};}
  const q=a-FALL, damp=Math.exp(-q*7);
  return{dy:-Math.abs(Math.sin(q*16))*28*damp,r:Math.sin(q*14)*2.5*damp,sq:1-.05*Math.cos(q*16)*damp*(q<.4?1:0)};
}
function wd(w,t,t0,big){
  const a=t-t0;if(a<0)return `<span class="w" style="opacity:0">${w}</span>`;
  const k=back(C(a/.4));
  return `<span class="w" style="opacity:${C(a/.1)};transform:translateY(${(1-C(a/.4))*40}px) scale(${L(big?1.6:.6,1,k)});filter:blur(${(1-eo(C(a/.3)))*8}px)">${w}</span>`;
}
const BOLT=[[870,213],[1227,213],[1020,713],[1220,713],[690,1390],[800,1090],[549,1090]];
const BL=(()=>{let s=0;for(let i=0;i<BOLT.length;i++){const p=BOLT[i],q=BOLT[(i+1)%BOLT.length];s+=Math.hypot(q[0]-p[0],q[1]-p[1])}return s})();
function render(t){
  let g='';
  // ---- background
  const bgk=seg(t,0,.6);
  // ---- bolt
  const bd=eio(seg(t,.4,1.5));
  let flick=1; if(t>.4&&t<1.6){flick=.55+.45*Math.abs(Math.sin(t*47)*Math.sin(t*13))}
  const flash=Math.exp(-Math.max(0,t-4.3)*5)*(t>4.3?1:0);
  const pulse=.85+.15*Math.sin(t*5);
  const bo=(t<1.6?flick:pulse)+flash*.6;
  const pts=BOLT.map(p=>p.join(',')).join(' ');
  g+=`<g opacity="${C(bo)*C(bd*5)}">
    <polygon points="${pts}" fill="none" stroke="#7fb0ff" stroke-width="${26+flash*30}" stroke-linejoin="miter" opacity=".35" filter="url(#bl1)" stroke-dasharray="${BL}" stroke-dashoffset="${BL*(1-bd)}"/>
    <polygon points="${pts}" fill="none" stroke="#bcd6ff" stroke-width="12" stroke-linejoin="miter" opacity=".7" filter="url(#bl2)" stroke-dasharray="${BL}" stroke-dashoffset="${BL*(1-bd)}"/>
    <polygon points="${pts}" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="miter" stroke-dasharray="${BL}" stroke-dashoffset="${BL*(1-bd)}"/></g>`;
  // ---- podium
  const pk=eo(seg(t,.1,.8)), py=L(320,0,pk);
  g+=`<g transform="translate(0,${py})" opacity="${seg(t,.1,.4)}">
    <rect x="620" y="1455" width="580" height="400" fill="url(#pod)"/>
    <ellipse cx="910" cy="1455" rx="290" ry="40" fill="url(#podTop)" stroke="#3d64d6" stroke-width="3"/>
    <ellipse cx="910" cy="1458" rx="${150*C((t-1.25)*3)}" ry="16" fill="#000" opacity=".5" filter="url(#bl2)"/></g>`;
  // ---- bottles (b3 first, then b2, b1 on top)
  let land=[];
  for(const k of ['b3','b2','b1']){const b=BOT[k],d=drop(b,t);if(!d)continue;
    const cx=b.x+b.w/2,cy=b.y+b.h/2,by=b.y+b.h;
    g+=`<g transform="translate(0,${d.dy}) rotate(${d.r} ${cx} ${cy}) translate(${cx} ${by}) scale(${2-d.sq} ${d.sq}) translate(${-cx} ${-by})">
      <image href="${k}.png" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/></g>`;
    const q=t-b.t0-FALL; if(q>0&&q<.7){const e=eo(q/.7);
      g+=`<ellipse cx="${cx}" cy="${by-6}" rx="${120+e*260}" ry="${18+e*40}" fill="none" stroke="#cfe0ff" stroke-width="${6*(1-e)}" opacity="${(1-e)*.8}"/>`;
      for(let i=0;i<8;i++){const an=Math.PI*(1+i/7),rr=60+e*170;g+=`<circle cx="${cx+Math.cos(an)*rr*1.4}" cy="${by-10+Math.sin(an)*rr*.5}" r="${5*(1-e)}" fill="#fff" opacity="${1-e}"/>`}}
  }
  // shine sweep over bottles after full stack
  const sw=seg(t,5.0,6.2);
  // ---- camera shake on landings
  let shake=0; for(const k in BOT){const q=t-BOT[k].t0-FALL; if(q>0&&q<.3)shake+=Math.sin(q*90)*10*(1-q/.3)}
  const q75=t-4.3; if(q75>0&&q75<.35)shake+=Math.sin(q75*80)*14*(1-q75/.35);
  // ---- headline
  const n=Math.round(75*eo(seg(t,3.9,4.3)));
  const pk75=t<3.9?0:back(C((t-3.9)/.45));
  const glow=flash;
  let html=`<div class="abs hd" style="right:${W-600}px;top:600px;font-size:150px">${wd('عبوه',t,1.2)} ${wd('+',t,2.05)} ${wd('عبوه',t,2.15)}</div>
    <div class="abs hd" style="right:${W-600}px;top:770px;font-size:150px">${wd('والتــالتــه',t,2.95)}</div>
    <div class="abs hd" style="right:${W-560}px;top:950px;font-size:110px">${wd('بــــ',t,3.45)} ${wd('خصم',t,3.6)}</div>
    <div class="abs hd" style="right:${W-600}px;top:1080px;font-size:230px;direction:ltr;opacity:${C((t-3.9)*8)};transform-origin:70% 60%;transform:scale(${t<3.9?0:pk75*(1+flash*.08)});text-shadow:0 0 ${10+glow*60}px rgba(160,200,255,${.35+glow*.6})"><span class="iso">${n}%</span></div>`;
  // sparkles around 75
  if(t>4.3){for(let i=0;i<6;i++){const ph=(t-4.3)*1.3+i*.37, f=ph%1, sx=[90,560,140,520,330,600][i], sy=[1130,1110,1290,1270,1090,1240][i];
    const sc=Math.sin(f*Math.PI);g+=`<g transform="translate(${(sx-OX)/S},${(sy-OY)/S}) scale(${sc*1.3}) rotate(${f*90})" opacity="${sc}"><path d="M0 -26 Q3 -3 26 0 Q3 3 0 26 Q-3 3 -26 0 Q-3 -3 0 -26Z" fill="#fff"/></g>`}}
  // CTA "اطلبه الآن"
  const ck=t<5.6?0:back(C((t-5.6)/.5)), tap=t-6.6, press=tap>0&&tap<.25?1-.08*Math.sin(tap/.25*Math.PI):1;
  const pul=t>7?1+.03*Math.sin((t-7)*6):1, hk=eo(seg(t,6.1,6.6)), hx=L(260,0,hk)+(tap>0&&tap<.25?Math.sin(tap/.25*Math.PI)*-6:0), ho=seg(t,6.1,6.3)*(1-seg(t,7.3,7.6));
  let rip='';for(let k=0;k<2;k++){const q=C((t-6.7-k*.18)/.8);if(q>0&&q<1)rip+=`<div class="abs" style="left:${330-260-q*60}px;top:${1420-70-q*40}px;width:${520+q*120}px;height:${140+q*80}px;border:4px solid rgba(255,255,255,${(1-q)*.8});border-radius:999px"></div>`}
  if(t>5.6)html+=rip+`<div class="abs" style="left:70px;top:1350px;width:520px;height:140px;border-radius:999px;background:#fff;box-shadow:0 0 ${30+20*Math.sin(t*5)}px rgba(150,190,255,.8),0 18px 40px rgba(0,10,40,.45);display:flex;align-items:center;justify-content:center;gap:22px;opacity:${C((t-5.6)*6)};transform:scale(${ck*press*pul})">
      <span style="font-family:Lalezar,Cairo;font-size:78px;color:#0d2f9e;direction:rtl;line-height:1;padding-top:10px">اطلبه الآن</span>
      <svg width="60" height="60" viewBox="-30 -30 60 60"><circle r="28" fill="#1f4fd8"/><path d="M6 -10 L-6 0 L6 10" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <svg class="abs" width="120" height="140" style="left:${400+hx}px;top:${1430+hk*0}px;opacity:${ho};transform:scale(${tap>0&&tap<.25?.9:1})" viewBox="0 0 120 140"><path d="M38 10 Q50 4 56 14 L56 58 L84 62 Q100 66 98 84 L92 118 Q90 130 76 130 L44 130 Q34 130 28 120 L8 86 Q4 76 14 72 Q22 70 28 78 L36 88 L36 18 Q36 12 38 10Z" fill="#fff" stroke="#0d2f9e" stroke-width="5" stroke-linejoin="round"/></svg>`;
  // footer + logo
  const lg=eo(seg(t,.3,1.0)), ftk=seg(t,4.8,5.4);
  html+=`<img class="abs" src="logo.png" style="left:52px;top:${110+(1-lg)*30}px;width:150px;opacity:${lg}">
    <div class="abs ft" style="right:60px;bottom:58px;opacity:${ftk};transform:translateY(${(1-ftk)*20}px)">رقم التسجيل: <span class="iso">2023/5222</span></div>
    <div class="abs ft" style="left:60px;bottom:58px;opacity:${ftk};transform:translateY(${(1-ftk)*20}px)">الرقم الضريبي: <span class="iso">643-176-624</span></div>`;
  const zoom=1.04-.04*eo(seg(t,0,DUR)), fl=.05*Math.sin(t*2.2)*seg(t,3.2,4);
  document.getElementById('stage').innerHTML=`
   <div class="abs" style="inset:0;background:radial-gradient(ellipse 75% 55% at 52% 42%, #4b79d3 0%, #2550b5 35%, #123a98 62%, #0b2a82 85%), #0b2a82;opacity:1"></div>
   <div class="abs" style="left:0;right:0;bottom:0;height:640px;background:linear-gradient(to bottom, rgba(3,8,22,0), rgba(3,8,22,.75) 60%, #030816)"></div>
   <div class="abs" style="inset:0;background:radial-gradient(circle at 75% 45%, rgba(170,205,255,${.25*flash}), rgba(0,0,0,0) 60%)"></div>
   <div class="abs" style="inset:0;transform:translate(${shake*.6}px,${shake}px) scale(${zoom})">
    <svg class="abs" width="${W}" height="${H}"><defs>
      <filter id="bl1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
      <filter id="bl2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
      <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14307f"/><stop offset=".5" stop-color="#081845"/><stop offset="1" stop-color="#030816"/></linearGradient>
      <linearGradient id="podTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a3a9c"/><stop offset=".5" stop-color="#2a52c4"/><stop offset="1" stop-color="#16348c"/></linearGradient>
      </defs>
      <g transform="translate(${OX},${OY}) scale(${S})">${g}</g></svg>
    ${html}
   </div>
   <div class="abs" style="inset:0;pointer-events:none;background:linear-gradient(105deg, rgba(255,255,255,0) ${L(-30,120,sw)}%, rgba(255,255,255,.10) ${L(-20,130,sw)}%, rgba(255,255,255,0) ${L(-10,140,sw)}%)"></div>`;
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
